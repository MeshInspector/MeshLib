name: Test Nuget package with .NET consumers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to test'
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  nuget-consumer-test:
    name: NuGet consumer test (${{ matrix.arch }}, net47, net10.0)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: ARM64
            runner: windows-11-vs2026-arm
    timeout-minutes: 30
    env:
      PROJECT_DIR: test_nuget/NugetTestProj
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Download nuget package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ${{ inputs.release_tag }} --pattern "*.nupkg" --repo ${{ github.repository }} --clobber

      - name: Put package into local NuGet feed
        id: feed
        shell: pwsh
        run: |
          $pkg = Get-ChildItem -Filter "MeshLib*.nupkg" | Select-Object -First 1
          if (!$pkg) {
            Write-Error "No MeshLib*.nupkg file found"
            exit 1
          }
          if ($pkg.Name -notmatch '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+') {
            Write-Error "Cannot extract version from $($pkg.Name)"
            exit 1
          }
          $pkgVersion = $Matches[0]
          $feedDir = Join-Path $env:GITHUB_WORKSPACE "$env:PROJECT_DIR/nuget_repo"
          New-Item -ItemType Directory -Force -Path $feedDir | Out-Null
          Move-Item $pkg.FullName (Join-Path $feedDir "MeshLib.$pkgVersion.nupkg")
          "package_version=$pkgVersion" >> $env:GITHUB_OUTPUT

      - name: Build consumers
        shell: pwsh
        run: |
          dotnet build $env:PROJECT_DIR -c Release -p:MeshLibVersion=${{ steps.feed.outputs.package_version }} -p:PlatformTarget=${{ matrix.arch }}

      - name: Run consumers
        shell: pwsh
        run: |
          $exitCode = 0
          foreach ($tfm in 'net47', 'net10.0') {
            & "$env:PROJECT_DIR/bin/Release/$tfm/NugetTestProj.exe"
            if ($LASTEXITCODE -ne 0) { $exitCode = $LASTEXITCODE }
          }
          exit $exitCode

  nuget-macos-load-test:
    name: NuGet macOS dylibs load test (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # The oldest macOS per arch: the bundled brew dylibs target the build
        # image, and load here only if they use no system symbol missing on this OS.
        include:
          - rid: osx-arm64
            runner: [ self-hosted, macos, arm64, macos-13 ]
          - rid: osx-x64
            runner: [ self-hosted, macos, x64, macos-12-intel ]
    timeout-minutes: 10
    steps:
      - name: Download nuget package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ${{ inputs.release_tag }} --pattern "*.nupkg" --repo ${{ github.repository }} --dir "$RUNNER_TEMP" --clobber

      - name: Load every dylib
        run: |
          sw_vers -productVersion
          rm -rf "$RUNNER_TEMP/nupkg"
          PKG=$(ls "$RUNNER_TEMP"/MeshLib*.nupkg | head -n 1)
          unzip -q "$PKG" "runtimes/${{ matrix.rid }}/native/*" -d "$RUNNER_TEMP/nupkg"
          FAILED=0
          for LIB in "$RUNNER_TEMP/nupkg/runtimes/${{ matrix.rid }}/native"/*.dylib ; do
            echo "$LIB"
            python3 -c 'import ctypes, sys; ctypes.CDLL(sys.argv[1])' "$LIB" || FAILED=1
          done
          exit $FAILED
