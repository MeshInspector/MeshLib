name: Build Rust bindings
description: >
  Installs Rust if needed, generates the Rust bindings from the C bindings
  (`make -f scripts/mrbind/generate.mk TARGET=rust generate`), then builds
  and runs the Rust examples and tests against the freshly built C libraries.
  The C bindings must have been built already.

inputs:
  lib-dir:
    required: true
    description: >
      Absolute path of the directory with the MeshLib and MeshLibC2 shared
      libraries, for linking and for the dynamic loader when running.
  target:
    required: false
    default: ''
    description: >
      Not on Windows: a Rust target triple to cross-compile for, such as
      `x86_64-apple-darwin` on an arm64 macOS host whose MeshLib libraries
      are x86_64. The examples and tests then run under the host's
      emulation (Rosetta). Empty: the host.
  windows-vsdevcmd:
    required: false
    default: ''
    description: >
      Windows only: the `call ...\VsDevCmd.bat ...` command that sets up the
      MSVC environment for `generate_win.bat`.

runs:
  using: composite
  steps:
    - name: Install Rust
      uses: ./.github/actions/setup-rust
      with:
        target: ${{ inputs.target }}

    - name: Build and run Rust examples and tests
      if: runner.os != 'Windows'
      shell: bash
      env:
        MESHLIB_LIB_DIR: ${{ inputs.lib-dir }}
        LD_LIBRARY_PATH: ${{ inputs.lib-dir }}
        TARGET: ${{ inputs.target }}
      run: |
        set -eu
        # Exported here, not in `env`: with System Integrity Protection on (the
        # self-hosted Macs), dyld strips DYLD_* from the environment of a platform
        # binary such as the /bin/bash that runs this step, so nothing below would
        # inherit it. Set after bash has started, it reaches cargo and the examples.
        export DYLD_LIBRARY_PATH="$MESHLIB_LIB_DIR"
        export CARGO_TARGET_DIR="$PWD/source/MeshLibRust/target"
        # With a target, cargo compiles and links the crates for it (the build
        # scripts still for the host) and puts the output under target/<triple>/.
        if [ -n "$TARGET" ]; then
          export CARGO_BUILD_TARGET="$TARGET"
        fi
        cargo build --manifest-path examples/rust-examples/Cargo.toml
        "$CARGO_TARGET_DIR/${TARGET:+$TARGET/}debug/MeshBoolean"
        cargo test --manifest-path source/MRTestRust/Cargo.toml

    - name: Build and run Rust examples and tests (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      env:
        MESHLIB_LIB_DIR: ${{ inputs.lib-dir }}
      run: |
        ${{ inputs.windows-vsdevcmd }} || exit /b 1
        set CARGO_TARGET_DIR=%CD%\source\MeshLibRust\target
        cargo build --manifest-path examples/rust-examples/Cargo.toml || exit /b 1
        set PATH=${{ inputs.lib-dir }};%PATH%
        "%CARGO_TARGET_DIR%\debug\MeshBoolean.exe" || exit /b 1
        cargo test --manifest-path source/MRTestRust/Cargo.toml || exit /b 1
