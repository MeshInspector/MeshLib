name: Wayland headless check

on:
  workflow_dispatch:
  push:
    branches: [ wayland-headless-check ]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/meshinspector/meshlib-ubuntu24:latest
      options: --user root
    env:
      MESHLIB_THIRDPARTY_ROOT_DIR: /usr/local/lib/MeshLib
      # the compositor and the viewer run as the image's unprivileged user, with WAYLAND_DISPLAY from the step
      AS_USER: runuser -u github-user -- env HOME=/tmp/home XDG_RUNTIME_DIR=/tmp/xdg LD_LIBRARY_PATH=/usr/local/lib
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout third-party submodules
        run: |
          export HOME=${RUNNER_TEMP}
          git config --global --add safe.directory '*'
          scripts/checkout_submodules.sh . thirdparty/imgui

      - name: Install Wayland build and run-time packages
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends libwayland-dev libxkbcommon-dev wayland-protocols libdecor-0-0 weston libegl1 libgles2 python3-pip
          apt-get remove -y libglfw3-dev || true
          weston --version

      - name: Build GLFW 3.4 with the X11 and Wayland backends
        run: |
          curl -fsSL -o /tmp/glfw.tar.gz https://github.com/glfw/glfw/archive/refs/tags/3.4.tar.gz
          mkdir -p /tmp/glfw && tar -C /tmp/glfw --strip-components=1 -xzf /tmp/glfw.tar.gz
          cmake -S /tmp/glfw -B /tmp/glfw/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DGLFW_BUILD_WAYLAND=ON -DGLFW_BUILD_X11=ON -DGLFW_BUILD_EXAMPLES=OFF -DGLFW_BUILD_TESTS=OFF -DGLFW_BUILD_DOCS=OFF
          cmake --build /tmp/glfw/build
          cmake --install /tmp/glfw/build --prefix /usr/local
          ldconfig
          ls -l /usr/local/lib/libglfw*

      - name: Build MeshViewer with MRVIEWER_EXPERIMENTAL_WAYLAND_SUPPORT=ON
        env:
          MESHLIB_BUILD_RELEASE: "ON"
          MESHLIB_BUILD_DEBUG: "OFF"
          CMAKE_C_COMPILER: clang
          CMAKE_CXX_COMPILER: clang++
          CMAKE_LINKER_TYPE: LLD
          MR_CMAKE_OPTIONS: >
            -DMRVIEWER_EXPERIMENTAL_WAYLAND_SUPPORT=ON
            -DMESHLIB_BUILD_MRCUDA=OFF
            -DMESHLIB_BUILD_PYTHON_MODULES=OFF
            -DMESHLIB_BUILD_MRMESH_PY_LEGACY=OFF
            -DMESHLIB_BUILD_GENERATED_C_BINDINGS=OFF
            -DMESHLIB_BUILD_MESHCONV=OFF
          MR_CMAKE_BUILD_OPTIONS: --target MeshViewer
        run: |
          export PATH=${LLVM_PREFIX}/bin:${PATH}
          ./scripts/build_source.sh
          grep -i 'glfw' build/Release/CMakeCache.txt | head
          ldd build/Release/bin/MeshViewer | grep -i glfw

      - name: Install the MCP client, hand the workspace to the unprivileged user (Weston refuses root)
        run: |
          python3 -m pip install --break-system-packages --ignore-installed mcp
          mkdir -p /tmp/home /tmp/xdg out
          chmod 0700 /tmp/xdg
          chown -R github-user /tmp/home /tmp/xdg "${GITHUB_WORKSPACE}"

      - name: Start Weston headless at scale 2 and at scale 1
        run: |
          ${AS_USER} weston --backend=headless --socket=wl-scale2 --width=3200 --height=2000 --scale=2 --idle-time=0 --renderer=gl --log=/tmp/weston-scale2.log &
          ${AS_USER} weston --backend=headless --socket=wl-scale1 --width=1600 --height=1000 --scale=1 --idle-time=0 --renderer=gl --log=/tmp/weston-scale1.log &
          sleep 3
          ls -l /tmp/xdg
          cat /tmp/weston-scale2.log

      - name: Run A, scale 2, fresh config (expect 1280x800 window = 2560x1600 framebuffer)
        env:
          WAYLAND_DISPLAY: wl-scale2
        run: |
          ${AS_USER} python3 scripts/devops/wayland_headless_check.py build/Release/bin/MeshViewer 7899 2560 1600 out/runA-scale2-fresh.png
          cp viewer_stdout.txt out/runA-stdout.txt
          cfg=$(find /tmp/home -name config.json | head -1)
          echo "config: ${cfg}"
          grep -A3 -i 'mainWindow' "${cfg}" || true

      - name: Run B, scale 2, saved screen size 1000x600 (expect 2000x1200 framebuffer)
        env:
          WAYLAND_DISPLAY: wl-scale2
        run: |
          cfg=$(find /tmp/home -name config.json | head -1)
          ${AS_USER} python3 scripts/devops/wayland_patch_config.py "${cfg}" 1000 600 2000 1200
          ${AS_USER} python3 scripts/devops/wayland_headless_check.py build/Release/bin/MeshViewer 7899 2000 1200 out/runB-scale2-restored.png
          cp viewer_stdout.txt out/runB-stdout.txt

      - name: Run C, scale 1, same saved config (expect 1000x600 framebuffer)
        env:
          WAYLAND_DISPLAY: wl-scale1
        run: |
          cfg=$(find /tmp/home -name config.json | head -1)
          ${AS_USER} python3 scripts/devops/wayland_patch_config.py "${cfg}" 1000 600
          ${AS_USER} python3 scripts/devops/wayland_headless_check.py build/Release/bin/MeshViewer 7899 1000 600 out/runC-scale1-restored.png
          cp viewer_stdout.txt out/runC-stdout.txt

      - name: Splash screenshots, scale 2 (compositor view during the first seconds)
        if: always()
        env:
          WAYLAND_DISPLAY: wl-scale2
        run: |
          cd out
          ${AS_USER} ../build/Release/bin/MeshViewer -mcpPort 7899 -console > splash-run-stdout.txt 2>&1 &
          pid=$!
          for i in 1 2 3 4 5 6; do sleep 0.7; ${AS_USER} weston-screenshooter || true; done
          sleep 5
          ${AS_USER} weston-screenshooter || true
          kill ${pid} || true
          sleep 2
          ls -l

      - name: Weston logs and viewer log files
        if: always()
        run: |
          mkdir -p out
          cp /tmp/weston-*.log out/ || true
          find /tmp/home -name '*.log' -exec cp {} out/ \; || true
          ls -l out

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayland-headless-check
          path: out/
