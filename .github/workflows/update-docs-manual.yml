name: Manual Update MeshLib Documentation Site

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      output_folder:
        required: false
        type: string
        default: "MeshLib/dev"

jobs:
  create-stubs:
    timeout-minutes: 40
    runs-on: ubuntu-24.04-arm
    container:
      image: meshlib/meshlib-ubuntu22-arm64:latest
    strategy:
      fail-fast: false
    env:
      CONFIG: Release
      CXX-COMPILER: /usr/bin/clang++-14
      CXX-STANDARD: 20
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read  # This is required for actions/checkout
      actions: read   # This is required for wait-for-job

    steps:
      - name: Work-around possible permission issues
        shell: bash
        run: |
          # NOTE: {GITHUB_WORKSPACE} != {{ github.workspace }}
          # Related issue: https://github.com/actions/runner/issues/2058
          if test -d $GITHUB_WORKSPACE && test -n "$(find ${GITHUB_WORKSPACE} -user root)" ; then
            mv ${GITHUB_WORKSPACE} ${GITHUB_WORKSPACE}_${RANDOM}
            mkdir ${GITHUB_WORKSPACE}
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout third-party submodules
        run: |
          # have to checkout selective submodules by our own
          # related issue: https://github.com/actions/checkout/issues/1779
          export HOME=${RUNNER_TEMP}
          git config --global --add safe.directory '*'
          # No retry.sh, linux scripts retry themselves.
          scripts/clone_submodules_linux.sh --skip-prebuilt-thirdparty

      - name: Install thirdparty libs
        run: |
          ln -s /usr/local/lib/meshlib-thirdparty-lib/lib ./lib
          ln -s /usr/local/lib/meshlib-thirdparty-lib/include ./include
          ln -s /usr/local/lib/meshlib-thirdparty-lib/share ./share

      - name: Install mrbind
        uses: ./.github/actions/build-mrbind
        with:
          cache-key-prefix: ubuntu-docs-clang
          build-script: scripts/mrbind/install_mrbind_ubuntu.sh
          extra-cache-key: ${{ hashFiles('scripts/mrbind/clang_version.txt', 'docker/ubuntu22Dockerfile') }}

      - name: Create virtualenv
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          echo $PATH >> $GITHUB_PATH

      - name: Setup python requirements
        run: python3 -m pip install -r ./requirements/python/requirements.txt

      - name: Build
        run: ./scripts/build_source.sh
        env:
          MESHLIB_BUILD_RELEASE: ON
          MESHLIB_BUILD_DEBUG: OFF
          CMAKE_CXX_COMPILER: ${{ env.CXX-COMPILER }}
          # options to be passed to cmake
          MR_CMAKE_OPTIONS: >
            -DMR_CXX_STANDARD=${{ env.CXX-STANDARD }}
            -DMR_PCH_USE_EXTRA_HEADERS=ON
            -DMESHLIB_BUILD_MRMESH_PY_LEGACY=OFF

      - name: Generate and build MRBind bindings
        env:
          CXX: ${{ env.CXX-COMPILER }}
        # PCH_CODEGEN=0: `-fpch-codegen` hits clang defect llvm/llvm-project#203691 on this image's
        # libstdc++-12, same as the ubuntu22 opt-out in build-test-ubuntu-arm64.yml.
        run: make -f scripts/mrbind/generate.mk MODE=none -B --trace MESHLIB_SHLIB_DIR=build/${{ env.CONFIG }}/bin PCH_CODEGEN=0

      - name: Create Python Stubs
        run: python3 ./scripts/wheel/create_stubs.py

      - name: Upload Python Stubs
        uses: actions/upload-artifact@v7
        with:
          name: PythonStubs
          path: ./scripts/wheel/meshlib/meshlib/*.pyi
          retention-days: 1

      # `TARGET=csharp` only reads `source/MeshLibC2/temp/interop_desc.json`, which the C
      # generator writes and the `CBindings` artifact carries, so the C bindings have to be
      # unpacked here first. Same steps as build-test-ubuntu-arm64.yml and pip-build.yml.
      - name: Wait for C bindings
        uses: ./.github/actions/wait-for-job
        with:
          job-name: generate-c-bindings

      - name: Download C bindings
        uses: actions/download-artifact@v8
        with:
          name: CBindings
          path: MeshLib/CbindingsTmp

      - name: Prepare C bindings folders
        run: |
          rm -rf source/MeshLibC2 source/MeshLibC2Cuda
          mv MeshLib/CbindingsTmp/MeshLibC2 source
          mv MeshLib/CbindingsTmp/MeshLibC2Cuda source

      - name: Generate C# bindings # generate only sources
        run: make -f scripts/mrbind/generate.mk TARGET=csharp -B --trace generate

      - name: Upload C# bindings headers
        uses: actions/upload-artifact@v7
        with:
          name: CsharpBindings
          path: ./source/MRDotNet2/src
          retention-days: 1

  generate-wasm-definitions:
    uses: ./.github/workflows/build-test-emscripten.yml
    with:
      docker_image_tag: latest
      upload_artifacts: false
      definitions_only: true

  # The `CBindings` artifact comes from the shared workflow, same as in pip-build.yml and
  # build-test-distribute.yml. Generating it inside `create-stubs` doesn't work: `TARGET=c`
  # targets Emscripten, and host headers are only usable on Linux x64, so on this arm64 runner
  # it needs an Emscripten SDK that the ubuntu22 image doesn't carry.
  generate-c-bindings:
    uses: ./.github/workflows/generate-c-bindings.yml
    with:
      docker_image_tag: latest

  update-dev-documentation:
    needs: [ create-stubs, generate-wasm-definitions, generate-c-bindings ]
    uses: ./.github/workflows/update-docs.yml
    with:
      output_folder: ${{ inputs.output_folder }}
    secrets: inherit

  delete-artifacts:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: [ update-dev-documentation ]
    if: always()
    continue-on-error: true
    steps:
      - name: Delete Python Stubs
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: PythonStubs
          failOnError: false
      - name: Delete C bindings headers
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: CBindings
          failOnError: false
      - name: Delete Csharp bindings
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: CsharpBindings
          failOnError: false
      - name: Delete Wasm definitions
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: WasmBindingsDts
          failOnError: false
