name: 'Verify meshlib.mrmeshpy import'
description: |
  Run scripts/ci/verify_meshlib_import.py with every Python version the
  runner has, to surface import failures with a real traceback.

inputs:
  build-bin-dir:
    description: 'Directory containing the meshlib/ package (e.g. build/Release/bin on Linux/macOS, source\x64\Release on Windows)'
    required: true
  arch:
    description: >-
      Machine architecture the modules were built for, as Python's platform.machine()
      reports it (x86_64 or arm64). When set, interpreters of another architecture are
      skipped: on the macOS x86_64 cross build the PATH also carries the host's native
      arm64 interpreters, which cannot load the x86_64 modules.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # The modules use the limited API of Python, so check them with every version of
    # scripts/wheel/python_versions.txt that the runner has, from PATH or from uv's
    # launcher directory; skip the versions that it doesn't have.

    - name: Verify meshlib.mrmeshpy import (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        PYTHONPATH: ${{ inputs.build-bin-dir }}
      run: |
        $versions = @(Get-Content "$Env:GITHUB_WORKSPACE/scripts/wheel/python_versions.txt" | Where-Object { $_.Trim() })
        $attempted = 0; $failed = 0; $skipped = @()
        foreach ($ver in $versions) {
          Write-Host ""
          Write-Host "===== verify with py -$ver ====="
          py "-$ver" -c "import sys" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "SKIP: py -$ver not available on runner"
            $skipped += $ver
            continue
          }
          $attempted++
          py "-$ver" -u "$Env:GITHUB_WORKSPACE/scripts/ci/verify_meshlib_import.py"
          if ($LASTEXITCODE -ne 0) { $failed++ }
        }
        if ($attempted -eq 0) {
          Write-Host "No listed Python version on the runner; running once with default py -3"
          py -3 -u "$Env:GITHUB_WORKSPACE/scripts/ci/verify_meshlib_import.py"
          exit $LASTEXITCODE
        }
        Write-Host ""
        Write-Host "Summary: versions=$($versions.Count) attempted=$attempted failed=$failed skipped=$($skipped.Count) [$($skipped -join ', ')]"
        if ($failed -gt 0) { exit 1 }

    - name: Verify meshlib.mrmeshpy import (Unix)
      if: runner.os != 'Windows'
      shell: bash
      env:
        PYTHONPATH: ${{ inputs.build-bin-dir }}
        TARGET_ARCH: ${{ inputs.arch }}
      run: |
        attempted=0
        failed=0
        skipped=()
        for ver in $(cat "$GITHUB_WORKSPACE/scripts/wheel/python_versions.txt"); do
          py_cmd="python${ver}"
          if ! command -v "$py_cmd" >/dev/null 2>&1 && command -v uv >/dev/null 2>&1; then
            uv_bin=$(uv python dir --bin)
            if [ -x "$uv_bin/$py_cmd" ]; then
              py_cmd="$uv_bin/$py_cmd"
            fi
          fi
          echo
          echo "===== verify with $py_cmd ====="
          if ! command -v "$py_cmd" >/dev/null 2>&1; then
            echo "SKIP: $py_cmd not on PATH"
            skipped+=( "$ver" )
            continue
          fi
          if [ -n "$TARGET_ARCH" ]; then
            py_arch=$("$py_cmd" -c 'import platform; print(platform.machine())' 2>/dev/null || echo unknown)
            if [ "$py_arch" != "$TARGET_ARCH" ]; then
              echo "SKIP: $py_cmd is $py_arch, the modules are $TARGET_ARCH"
              skipped+=( "$ver" )
              continue
            fi
          fi
          attempted=$((attempted + 1))
          if ! "$py_cmd" -u "$GITHUB_WORKSPACE/scripts/ci/verify_meshlib_import.py"; then
            failed=$((failed + 1))
          fi
        done
        if [ "$attempted" -eq 0 ]; then
          echo "No listed Python version on the runner; running once with default python3"
          exec python3 -u "$GITHUB_WORKSPACE/scripts/ci/verify_meshlib_import.py"
        fi
        echo
        echo "Summary: attempted=$attempted failed=$failed skipped=${#skipped[@]} [${skipped[*]}]"
        [ "$failed" -eq 0 ]
