name: 'Set up vcpkg for MeshLib (macOS)'
description: 'Builds the vcpkg dependencies into ./vcpkg_installed, using the GitHub cache.'

inputs:
  vcpkg-version:
    description: 'Vcpkg tag.'
    required: true
  vcpkg-triplet:
    description: 'Vcpkg triplet.'
    required: true
  c-compiler:
    description: 'C compiler.'
    required: true
  cxx-compiler:
    description: 'C++ compiler.'
    required: true
  toolchain:
    description: 'Toolchain name for the cache key.'
    required: true
  internal-build:
    description: 'Write to the S3 binary cache ("true" or "false"); needs `id-token: write`.'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up vcpkg
      shell: bash
      working-directory: /usr/local/share/vcpkg
      run: |
        git fetch --depth 1 origin tag "${{ inputs.vcpkg-version }}"
        git checkout --force "${{ inputs.vcpkg-version }}"
        ./bootstrap-vcpkg.sh -disableMetrics

    - name: Configure AWS Credentials
      if: ${{ inputs.internal-build == 'true' }}
      uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
      with:
        role-to-assume: arn:aws:iam::259351611210:role/GitHubMeshLibAwsCredsRole
        aws-region: us-east-1
        role-duration-seconds: 7200
        retry-max-attempts: 5

    - name: Resolve compilers
      shell: bash
      run: |
        # /usr/bin/clang is the xcode-select shim; resolve the toolchain binary it dispatches to
        resolve() {
          case "$1" in
            /usr/bin/*) xcrun --find "${1##*/}" ;;
            *) echo "$1" ;;
          esac
        }
        echo "VCPKG_CC=$(resolve '${{ inputs.c-compiler }}')" >> $GITHUB_ENV
        echo "VCPKG_CXX=$(resolve '${{ inputs.cxx-compiler }}')" >> $GITHUB_ENV

    - name: Compute vcpkg cache key
      shell: bash
      env:
        VCPKG_TRIPLET: ${{ inputs.vcpkg-triplet }}
      run: |
        FILES_HASH=$(scripts/devops/cache_key.sh \
          thirdparty/vcpkg/vcpkg.json \
          thirdparty/vcpkg/ports \
          thirdparty/vcpkg/triplets/${VCPKG_TRIPLET}.cmake \
          scripts/build_vcpkg_thirdparty.sh \
          "${VCPKG_CXX}")
        KEY_PREFIX="vcpkg-installed-${{ inputs.vcpkg-version }}-${VCPKG_TRIPLET}-${{ inputs.toolchain }}"
        echo "VCPKG_CACHE_KEY_PREFIX=${KEY_PREFIX}" >> $GITHUB_ENV
        echo "VCPKG_CACHE_KEY=${KEY_PREFIX}-${FILES_HASH}" >> $GITHUB_ENV

    - name: Restore vcpkg installed tree
      id: vcpkg-cache
      uses: actions/cache/restore@v5
      with:
        path: vcpkg_installed
        key: ${{ env.VCPKG_CACHE_KEY }}
        # fall back to the latest tree with the same prefix
        restore-keys: ${{ env.VCPKG_CACHE_KEY_PREFIX }}-

    - name: Build thirdparty libs
      shell: bash
      env:
        VCPKG_TRIPLET: ${{ inputs.vcpkg-triplet }}
        VCPKG_VERSION: ${{ inputs.vcpkg-version }}
      run: |
        source thirdparty/vcpkg/configure_s3_cache.sh
        export CC="${VCPKG_CC}"
        export CXX="${VCPKG_CXX}"
        export SDKROOT=$(xcrun --show-sdk-path)
        scripts/build_vcpkg_thirdparty.sh

    - name: Save vcpkg installed tree
      if: ${{ steps.vcpkg-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: vcpkg_installed
        key: ${{ env.VCPKG_CACHE_KEY }}
