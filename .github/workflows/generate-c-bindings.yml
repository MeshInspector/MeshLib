name: Build and test Ubuntu x64

on:
  workflow_call:
    inputs:
      docker_image_tag:
        required: true
        type: string
      version_tag:
        required: false
        type: string
        default: ''
      upload_artifacts:
        required: false
        type: boolean
        default: false

jobs:
  generate-c-bindings:
    timeout-minutes: 60
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read  # This is required for actions/checkout
    container:
      image: meshlib/meshlib-emscripten-generate-c-bindings-arm64:${{inputs.docker_image_tag}}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{inputs.version_tag}}

      - name: Checkout third-party submodules
        run: |
          # have to checkout selective submodules by our own
          # related issue: https://github.com/actions/checkout/issues/1779
          export HOME=${RUNNER_TEMP}
          git config --global --add safe.directory '*'
          # Retried via retry.sh: submodule endpoints occasionally 500.
          bash scripts/retry.sh --timeout 300 -- scripts/clone_submodules_emscripten_bindings.sh

      - name: Install MRBind
        uses: ./.github/actions/build-mrbind
        with:
          # The Dockerfile hash in extra-cache-key busts the cache whenever the
          # toolchain inside the image changes (e.g. glibc, clang upgrade).
          cache-key-prefix: ubuntu-arm64-emscripten
          build-script: scripts/mrbind/install_mrbind_ubuntu.sh
          extra-cache-key: ${{ hashFiles('scripts/mrbind/clang_version.txt', 'docker/emscripten-generate-c-bindingsDockerfile') }}

        # We're not using the host headers here because it's more important to check that the normal way of building the bindings (i.e. using Emscripten headers) works,
        #   because you can do this on every OS, as opposed to using host headers, which only works on Linux x64.

        # This version omits some extra IO formats, that's the only difference.
      - name: Generate C bindings (Wasm version)
        run: |
          cp -r source/MeshLibC2 source/MeshLibC2_orig
          make -f scripts/mrbind/generate.mk TARGET=c -B --trace EM_USE_HOST_HEADERS=0 ENABLE_CUDA=1 C_FOR_WASM=1
          mv source/MeshLibC2 source/MeshLibC2Wasm
          mv source/MeshLibC2_orig source/MeshLibC2

      - name: Generate C bindings
        run: |
          make -f scripts/mrbind/generate.mk TARGET=c -B --trace EM_USE_HOST_HEADERS=0 ENABLE_CUDA=1

      - name: Upload C bindings
        uses: actions/upload-artifact@v7
        with:
          name: CBindings
          path: |
            ./source/MeshLibC2
            ./source/MeshLibC2Wasm
            ./source/MeshLibC2Cuda
          retention-days: 1

        # Unlike the other artifact, here we strip some temporary files, and the project files.
      - name: Prepare source distribution
        if: ${{ inputs.upload_artifacts }}
        shell: bash
        run: |
          mkdir -p meshlib_c-source/MeshLibC2
          mkdir -p meshlib_c-source/MeshLibC2Cuda
          mkdir -p meshlib_c-source-wasm/MeshLibC2
          for x in include src; do
              cp -r source/MeshLibC2/$x meshlib_c-source/MeshLibC2/$x
              cp -r source/MeshLibC2Cuda/$x meshlib_c-source/MeshLibC2Cuda/$x
              cp -r source/MeshLibC2Wasm/$x meshlib_c-source-wasm/MeshLibC2/$x
          done
          zip -r meshlib_c-source.zip meshlib_c-source
          zip -r meshlib_c-source-wasm.zip meshlib_c-source-wasm

      - name: Upload source distribution
        if: ${{ inputs.upload_artifacts }}
        uses: actions/upload-artifact@v7
        with:
          name: DistributivesCSource
          path: meshlib_c-source.zip
          retention-days: 1

      - name: Upload source distribution (Wasm)
        if: ${{ inputs.upload_artifacts }}
        uses: actions/upload-artifact@v7
        with:
          name: DistributivesCSource
          path: meshlib_c-source-wasm.zip
          retention-days: 1
