name: Publish Wasm module

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      release_tag:
        required: true
        type: string
      draft:
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      draft:
        required: false
        type: boolean
        default: true

env:
  TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
  IS_DRAFT: ${{ inputs.draft || false }}

jobs:
  cdn:
    permissions:
      id-token: write   # OIDC -> AWS
      contents: write   # download the draft release asset
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
        # For `scripts/npm/bundle_cdn.sh`.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/npm/bundle_cdn.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::662635244517:role/GitHubMeshLibCdn
          aws-region: us-east-1

      - name: Download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${TAG}" --pattern "js-meshlib-*.tgz" --repo ${{ github.repository }} --clobber

        # The package is a directory of ES modules (`index.mjs`, `ffi.mjs`, `lib/`, `ns/`) importing each other, which the bundlers
        # tree-shake; from a CDN that would be dozens of requests, so here they're bundled into one `index.mjs` (`bundle_cdn.sh`,
        # which the CI tests). The Emscripten glue and the wasm stay separate files:
        # the glue locates the wasm from its own URL, and the workers of the multithreaded build load it by URL. The three go
        # under `<package>@<tag>/`, compressed once into a staging tree and uploaded per content type. The Node build and the
        # declarations are useless from a CDN and are skipped.
        # `<package>/index.mjs` (the unpinned entry point) only re-exports the tagged tree: replacing the files in place would let
        # a client mix the new `index.mjs` with the cached old glue or wasm.
        # The unpinned `<package>/` of the light packages is a copy of the tagged files: their multithreaded build is loaded cross-origin
        # by fetching the glue's text into a Blob for the workers, and a re-exporting stub there would leave a relative import that a
        # `blob:` URL can't resolve.
      - name: Upload to S3
        env:
          BUCKET: s3://cdn-meshlib-js
        run: |
          for TGZ in js-meshlib-*.tgz ; do
            NAME=${TGZ#js-}            # meshlib-1.2.3-4.tgz
            NAME=${NAME%%-[0-9]*}      # meshlib, meshlib-mt, meshlib-light, meshlib-light-mt
            mkdir -p "src/${NAME}" "pkg/${NAME}"
            tar -xzf "${TGZ}" --strip-components=1 -C "src/${NAME}"
            case "${NAME}" in
              meshlib|meshlib-mt)
                scripts/npm/bundle_cdn.sh "src/${NAME}" "pkg/${NAME}/index.mjs"
                cp "src/${NAME}/MeshLibC2.mjs" "src/${NAME}/MeshLibC2.wasm" "src/${NAME}/README.md" "src/${NAME}/LICENSE" "pkg/${NAME}/"
                ;;
              meshlib-light|meshlib-light-mt)
                cp "src/${NAME}/${NAME}.mjs" "src/${NAME}/${NAME}.wasm" "src/${NAME}/README.md" "src/${NAME}/LICENSE" "pkg/${NAME}/"
                ;;
            esac
            # Stored compressed once, served as is: every browser that runs wasm decodes Brotli, which is a third smaller than gzip here.
            # Window 24 (16 MB) is the largest a browser accepts.
            # `-exec ... {} +` (not `\;`) makes `find` fail when the command does.
            find "pkg/${NAME}" -type f -exec sh -ec 'for f ; do brotli -q 11 -w 24 -c "$f" > "$f.br" ; mv "$f.br" "$f" ; done' _ {} +
          done
          # All four packages are attached to every release.
          for f in meshlib meshlib-mt meshlib-light meshlib-light-mt ; do
            [ -d "pkg/${f}" ] || { echo "::error::js-${f}-*.tgz is missing from the release" ; exit 1 ; }
          done
          # One recursive upload per content type.
          upload() {
            local src="$1" dest="$2" ; shift 2
            aws s3 cp "${src}" "${dest}" --recursive --only-show-errors --content-encoding br --exclude '*' --include '*.mjs'  --content-type text/javascript  "$@"
            aws s3 cp "${src}" "${dest}" --recursive --only-show-errors --content-encoding br --exclude '*' --include '*.wasm' --content-type application/wasm "$@"
            aws s3 cp "${src}" "${dest}" --recursive --only-show-errors --content-encoding br --exclude '*' --include '*.md'   --content-type text/markdown    "$@"
            aws s3 cp "${src}" "${dest}" --recursive --only-show-errors --content-encoding br --exclude '*' --include 'LICENSE' --content-type text/plain      "$@"
          }
          for f in meshlib meshlib-mt meshlib-light meshlib-light-mt ; do
            if [ "${IS_DRAFT}" = "true" ] ; then
              upload "pkg/${f}" "${BUCKET}/${f}-draft" --cache-control "public, max-age=300"
            else
              upload "pkg/${f}" "${BUCKET}/${f}@${TAG}" --cache-control "public, max-age=31536000, immutable"
              case "${f}" in
                meshlib|meshlib-mt)
                  # Compressed into a file first: a failing `brotli` piped into `aws` would upload an empty stub.
                  printf 'export * from "../%s@%s/index.mjs";\n' "${f}" "${TAG}" | brotli -q 11 -w 24 -c > "stub-${f}.mjs"
                  aws s3 cp "stub-${f}.mjs" "${BUCKET}/${f}/index.mjs" --content-type text/javascript --content-encoding br --cache-control "public, max-age=300"
                  ;;
                meshlib-light|meshlib-light-mt)
                  upload "pkg/${f}" "${BUCKET}/${f}" --cache-control "public, max-age=300"
                  ;;
              esac
            fi
          done

      - name: Invalidate draft
        if: ${{ env.IS_DRAFT == 'true' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CDN_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/meshlib-draft/*" "/meshlib-mt-draft/*" "/meshlib-light-draft/*" "/meshlib-light-mt-draft/*"

      - name: Invalidate latest
        if: ${{ env.IS_DRAFT != 'true' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CDN_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/meshlib/index.mjs" "/meshlib-mt/index.mjs" "/meshlib-light/*" "/meshlib-light-mt/*"

  npm:
    permissions:
      id-token: write   # OIDC -> npm trusted publishing
      contents: write   # download the draft release asset
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24   # staged publishing needs npm >= 11.15
          registry-url: https://registry.npmjs.org

      - name: Download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${TAG}" --pattern "js-meshlib-*.tgz" --repo ${{ github.repository }} --clobber

        # Re-runnable: the versions already on npm are skipped (npm refuses to publish a version twice), and a failure doesn't stop
        # the other packages. A version staged by a previous run but not approved yet isn't visible to `npm view`, and staging it
        # again fails: approve or reject the staged versions before a re-run.
      - name: Publish npm packages
        run: |
          if [ "${IS_DRAFT}" = "true" ] ; then
            ARGS="--dry-run"
          else
            ARGS="--provenance"
          fi
          FAILED=""
          for TGZ in js-meshlib-*.tgz ; do
            ID=$(tar -xzOf "${TGZ}" package/package.json | node -p 'const p = JSON.parse(require("fs").readFileSync(0)); `${p.name}@${p.version}`')
            # Prints nothing (and fails) when the version or the whole package isn't on npm.
            if [ -n "$(npm view "${ID}" version 2>/dev/null || true)" ] ; then
              echo "::notice::${ID} is already published, skipped"
            elif ! npm stage publish "./${TGZ}" --access public --tag latest ${ARGS} ; then
              echo "::error::Failed to stage ${ID}"
              FAILED="${FAILED} ${ID}"
            fi
          done
          [ -z "${FAILED}" ] || { echo "Failed:${FAILED}" ; exit 1 ; }
