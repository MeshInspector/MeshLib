name: Publish Java Maven artifacts

# Publishes `com.meshinspector:meshlib` to Maven Central: the bindings jar of `meshlib_<version>_java_bindings.zip` of the release, which downloads
# the libraries from the release's `meshlib_<version>_native_<platform>.zip` on the first use (see `scripts/java/pack_maven.sh`),
# so these archives must stay in the release.
# Needs the secrets MAVEN_CENTRAL_USERNAME and MAVEN_CENTRAL_PASSWORD (a user token of the Sonatype Central Portal account that owns
# the `com.meshinspector` namespace), MAVEN_GPG_PRIVATE_KEY (ASCII-armored) and MAVEN_GPG_PASSPHRASE; the public key must be on a keyserver.

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version_tag:
        description: Tag of the release to publish the Maven artifacts of
        required: true
        type: string

jobs:
  publish:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Java
        uses: ./.github/actions/setup-java

      - name: Pack the Maven artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version_tag || github.event.release.tag_name }}
        run: |
          VERSION="${TAG%%-*}"
          scripts/retry.sh -- gh release download "$TAG" --repo ${{ github.repository }} --dir downloaded \
            --pattern "meshlib_${VERSION}_java_bindings.zip" --pattern "meshlib_${VERSION}_native_*.zip"
          unzip -q "downloaded/meshlib_${VERSION}_java_bindings.zip" -d downloaded
          scripts/java/pack_maven.sh "$VERSION" downloaded/MeshLibJava downloaded "https://github.com/${{ github.repository }}/releases/download/$TAG" maven
          COUNT=$(ls downloaded/meshlib_*_native_*.zip | wc -l)
          if [ "$COUNT" -ne 6 ]; then
            echo "::error::Expected the native archives of 6 platforms, got $COUNT"
            exit 1
          fi
          echo "MAVEN_VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      # Re-running for an already published version must not fail: Maven Central never accepts the same version twice.
      - name: Check if already published
        id: check
        run: |
          STATUS="$(curl -s -o /dev/null -w '%{http_code}' "https://repo1.maven.org/maven2/com/meshinspector/meshlib/$MAVEN_VERSION/meshlib-$MAVEN_VERSION.pom")"
          echo "Maven Central status for meshlib $MAVEN_VERSION: $STATUS"
          echo "published=$([ "$STATUS" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Sign
        if: ${{ steps.check.outputs.published == 'false' }}
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          echo "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import
          cd maven/com/meshinspector/meshlib/$MAVEN_VERSION
          for FILE in *.jar *.pom; do
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --armor --detach-sign "$FILE" <<< "$MAVEN_GPG_PASSPHRASE"
            md5sum "$FILE" | cut -d' ' -f1 > "$FILE.md5"
            sha1sum "$FILE" | cut -d' ' -f1 > "$FILE.sha1"
          done
          ls -l
          rm -rf "$GNUPGHOME"

      # `AUTOMATIC`: published as soon as Maven Central validates the bundle, then it takes a while to appear on repo1.maven.org.
      - name: Publish
        if: ${{ steps.check.outputs.published == 'false' }}
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          (cd maven && zip -qr ../bundle.zip com)
          ls -l bundle.zip
          AUTH="Authorization: Bearer $(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w0)"
          ID="$(curl -sS --fail-with-body -X POST -H "$AUTH" -F "bundle=@bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=meshlib-$MAVEN_VERSION&publishingType=AUTOMATIC")"
          echo "Deployment $ID"
          for i in $(seq 120); do
            sleep 15
            STATUS="$(curl -sS --fail-with-body -X POST -H "$AUTH" "https://central.sonatype.com/api/v1/publisher/status?id=$ID")"
            STATE="$(jq -r .deploymentState <<< "$STATUS")"
            echo "$STATE"
            case "$STATE" in
              PUBLISHING|PUBLISHED) exit 0 ;;
              FAILED) jq . <<< "$STATUS"; exit 1 ;;
            esac
          done
          echo "::error::Deployment $ID is still $STATE, see https://central.sonatype.com/publishing/deployments"
          exit 1
