name: Update Translation Template Files

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"  # Run every day at 04:00 UTC

jobs:
  update-pot-files:
    runs-on: ubuntu-latest
    container:
      image: fedora:43  # gettext 0.25.1

    env:
      GIT_BRANCH_NAME: auto-ci/update_pot_files

    steps:
      - name: Install tools
        run: |
          dnf install -y gettext gh git python3

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: master
          token: ${{ secrets.MESHINSPECTOR_BOT_VCPKG_UPDATE_TOKEN }} # TODO: replace token?
          fetch-depth: 0  # the branch below is continued, so a merge base must be reachable

      # https://github.com/actions/checkout/issues/766
      - name: Fix git permissions
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}

      - name: Continue or start the update branch
        run: |
          git config --global user.email "${{ secrets.MESHINSPECTOR_BOT_EMAIL }}@gmail.com"
          git config --global user.name "meshinspector-bot"

          # Never force-push: on a daily cron that discards whatever was pushed to the open PR.
          if git ls-remote --exit-code --heads origin "$GIT_BRANCH_NAME" > /dev/null 2>&1 ; then
            git fetch --no-tags origin "$GIT_BRANCH_NAME"
            git switch -c "$GIT_BRANCH_NAME" "origin/$GIT_BRANCH_NAME"
            git merge --no-edit origin/master
          else
            git switch -c "$GIT_BRANCH_NAME" origin/master
          fi

      - name: Update translation templates
        run: |
          scripts/gettext/update_translations.py --package-name=MeshLib locale/MeshLib.pot source/
          scripts/gettext/update_json_translations.py --package-name=MeshLib locale/MRRibbonCommonMenuStructure.pot source/MRCommonPlugins/MRRibbonCommonMenuStructure.items.json

      - name: Check for changes
        id: check-diff
        run: |
          # ignore auto-updated timestamp, ignore source line comments
          pot_diff () { git diff --unified=0 --ignore-matching-lines="POT-Creation-Date.*" --ignore-matching-lines="#: .*" locale/*.pot ; }
          pot_diff
          if [ -n "$(pot_diff)" ] ; then
            echo "need_update=true" >> $GITHUB_OUTPUT
          else
            # POT-Creation-Date churns on every run; revert rather than commit daily noise.
            git checkout -- locale/*.pot
            echo "need_update=false" >> $GITHUB_OUTPUT
          fi

      - name: Push changes
        if: ${{ steps.check-diff.outputs.need_update == 'true' }}
        run: |
          git commit -am "Auto CI: Update translation templates"
          git push origin $GIT_BRANCH_NAME

      - name: Create pull request
        if: ${{ steps.check-diff.outputs.need_update == 'true' }}
        # https://github.com/cli/cli/discussions/5792#discussioncomment-2939617
        # > running `gh pr create` on a branch that already has a PR will error out with a descriptive message
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.MESHINSPECTOR_BOT_VCPKG_UPDATE_TOKEN }} # TODO: replace token?
        run: |
          gh pr create --title "Auto CI: Update translation templates" \
                       --base master \
                       --head $GIT_BRANCH_NAME \
                       --reviewer oitel,Grantim
