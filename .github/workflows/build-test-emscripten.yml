name: Build and test Emscripten

on:
  workflow_call:
    inputs:
      app_version:
        required: false
        type: string
      docker_image_tag:
        required: true
        type: string
      internal_build:
        required: false
        type: boolean
      upload_artifacts:
        required: true
        type: boolean
      version_tag:
        required: false
        type: string
        default: ''

jobs:
  emscripten-build:
    timeout-minutes: 40
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/meshinspector/meshlib-emscripten-arm64:${{ inputs.docker_image_tag }}
    strategy:
      fail-fast: false
      matrix:
        config: [Singlethreaded, Multithreaded, Multithreaded-64Bit]
        include:
          - config: Singlethreaded
            target_name: emscripten-singlethreaded
            package_name: emscripten-singlethreaded
            thirdparty-dir: emscripten-single
          - config: Multithreaded
            target_name: emscripten
            package_name: emscripten-multithreaded
            thirdparty-dir: emscripten
          - config: Multithreaded-64Bit
            target_name: emscripten-wasm64
            package_name: emscripten-multithreaded-64bit
            thirdparty-dir: emscripten-wasm64

    steps:
      - name: Work-around possible permission issues
        shell: bash
        run: |
          # NOTE: {GITHUB_WORKSPACE} != {{ github.workspace }}
          # Related issue: https://github.com/actions/runner/issues/2058
          if test -d $GITHUB_WORKSPACE && test -n "$(find ${GITHUB_WORKSPACE} -user root)" ; then
            mv ${GITHUB_WORKSPACE} ${GITHUB_WORKSPACE}_${RANDOM}
            mkdir ${GITHUB_WORKSPACE}
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Get AWS instance type
        uses: ./.github/actions/get-aws-instance-type

      - name: Collect runner's system stats
        if: ${{ inputs.internal_build }}
        id: collect-runner-stats
        continue-on-error: true
        uses: ./.github/actions/collect-runner-stats
        with:
          target_os: ${{ matrix.target_name }}
          target_arch: wasm
          cxx_compiler: emcc
          build_config: Release
          aws_instance_type: ${{ env.AWS_INSTANCE_TYPE }}

      - name: Checkout third-party submodules
        run: |
          # have to checkout selective submodules by our own
          # related issue: https://github.com/actions/checkout/issues/1779
          export HOME=${RUNNER_TEMP}
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
          # Retried via retry.sh: submodule endpoints occasionally 500.
          bash scripts/retry.sh --timeout 300 -- scripts/clone_submodules_emscripten.sh --skip-prebuilt-thirdparty

      - name: Install thirdparty libs
        run: |
          ln -s /usr/local/lib/${{ matrix.thirdparty-dir }}/include ./include
          ln -s /usr/local/lib/${{ matrix.thirdparty-dir }}/lib ./lib
          ln -s /usr/local/lib/${{ matrix.thirdparty-dir }}/share ./share

      - name: Build
        env:
          MR_EMSCRIPTEN: "ON"
          MESHLIB_BUILD_RELEASE: "ON"
          MESHLIB_BUILD_DEBUG: "OFF"
          MR_EMSCRIPTEN_SINGLE: ${{ fromJSON('["OFF", "ON"]')[matrix.config == 'Singlethreaded'] }}
          MR_EMSCRIPTEN_WASM64: ${{ fromJSON('["OFF", "ON"]')[matrix.config == 'Multithreaded-64Bit'] }}
          # options to be passed to cmake
          MR_CMAKE_OPTIONS: >
            -DMR_CXX_STANDARD=23
            -DMR_PCH_USE_EXTRA_HEADERS=ON
            -DMRVOXELS_UNITY_BUILD=ON
        run: ./scripts/build_source.sh

      - name: Stage MRTest bundle
        run: |
          mkdir mrtest-bundle
          cp build/Release/bin/MRTest* /emsdk/upstream/emscripten/emrun.py mrtest-bundle/

      - name: Upload MRTest bundle
        uses: actions/upload-artifact@v7
        with:
          name: MRTest_${{ matrix.package_name }}
          path: mrtest-bundle
          retention-days: 1

      - name: Create Package
        run: |
          cp -a /usr/local/lib/${{ matrix.thirdparty-dir }} ./meshlib_install
          ./scripts/cmake_install.sh ./meshlib_install
          ( cd ./meshlib_install ; zip -r ../meshlib_${{ matrix.package_name }} * )

      - name: Build C++ examples
        run: |
          emcmake cmake \
            -S examples/cpp-examples \
            -B cpp-examples-build \
            -D CMAKE_FIND_ROOT_PATH=$(pwd)/meshlib_install/ \
            ${{ matrix.target_name == 'emscripten-wasm64' && '-D CMAKE_C_FLAGS="-sMEMORY64=1" -D CMAKE_CXX_FLAGS="-sMEMORY64=1"' || '' }}
          cmake \
            --build cpp-examples-build \
            --parallel $(nproc)

      - name: Upload Package
        if: ${{ inputs.upload_artifacts }}
        uses: actions/upload-artifact@v7
        with:
          name: Distributives_${{ matrix.package_name }}
          path: meshlib_${{ matrix.package_name }}.zip
          retention-days: 1

      - name: Collect artifact stats
        if: ${{ inputs.internal_build && inputs.upload_artifacts }}
        continue-on-error: true
        uses: ./.github/actions/collect-artifact-stats
        with:
          artifact_path: ${{ github.workspace }}
          artifact_glob: meshlib_${{ matrix.package_name }}.zip
          stats_file_suffix: -${{ steps.collect-runner-stats.outputs.job_id }}

  wasm-module-build:
    timeout-minutes: 60
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/meshinspector/meshlib-emscripten-arm64:${{ inputs.docker_image_tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Singlethreaded
            thirdparty-dir: emscripten-single
            wasm-module-name: meshlib
            singlethread: 1
            wasm64: 0
            js-dir: js
          - config: Multithreaded
            thirdparty-dir: emscripten
            wasm-module-name: meshlib-mt
            singlethread: 0
            wasm64: 0
            js-dir: js
          # No npm package for the 64-bit module: it needs Memory64, which the current browsers only started to ship.
          - config: Multithreaded-64Bit
            thirdparty-dir: emscripten-wasm64
            wasm-module-name: meshlib-mt64
            singlethread: 0
            wasm64: 1
            js-dir: js64
    steps:
      - name: Work-around possible permission issues
        shell: bash
        run: |
          # NOTE: {GITHUB_WORKSPACE} != {{ github.workspace }}
          # Related issue: https://github.com/actions/runner/issues/2058
          if test -d $GITHUB_WORKSPACE && test -n "$(find ${GITHUB_WORKSPACE} -user root)" ; then
            mv ${GITHUB_WORKSPACE} ${GITHUB_WORKSPACE}_${RANDOM}
            mkdir ${GITHUB_WORKSPACE}
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout third-party submodules
        run: |
          # have to checkout selective submodules by our own
          # related issue: https://github.com/actions/checkout/issues/1779
          export HOME=${RUNNER_TEMP}
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
          # Retried via retry.sh: submodule endpoints occasionally 500.
          bash scripts/retry.sh --timeout 300 -- scripts/clone_submodules_emscripten.sh --skip-prebuilt-thirdparty

      - name: Install thirdparty libs
        run: |
          ln -s /usr/local/lib/${{ matrix.thirdparty-dir }}/include ./include
          ln -s /usr/local/lib/${{ matrix.thirdparty-dir }}/lib ./lib
          ln -s /usr/local/lib/${{ matrix.thirdparty-dir }}/share ./share

        # The C bindings and the JS generated from them, by the `generate-c-bindings` job.
      - name: Download C bindings
        uses: actions/download-artifact@v8
        with:
          name: CBindings
          path: MeshLib/CbindingsTmp

      - name: Prepare C and JS bindings folders
        shell: bash
        run: |
          rm -rf source/MeshLibC2 source/MeshLibJS/js source/MeshLibJS/js64
          mv MeshLib/CbindingsTmp/MeshLibC2Wasm source/MeshLibC2
          mv MeshLib/CbindingsTmp/MeshLibJS/js source/MeshLibJS/js
          mv MeshLib/CbindingsTmp/MeshLibJS/js64 source/MeshLibJS/js64
          # Cuda placeholders:
          cp -r scripts/mrbind/cuda_placeholder_generated_c/{include,src} source/MeshLibC2Cuda

      - name: Build Wasm module
        env:
          MR_EMSCRIPTEN: "ON"
          MESHLIB_BUILD_RELEASE: "ON"
          MESHLIB_BUILD_DEBUG: "OFF"
          MR_EMSCRIPTEN_SINGLE: ${{ fromJSON('["OFF", "ON"]')[matrix.singlethread == 1] }}
          MR_EMSCRIPTEN_WASM64: ${{ fromJSON('["OFF", "ON"]')[matrix.wasm64 == 1] }}
          MR_CMAKE_OPTIONS: >
            -DMR_CXX_STANDARD=23
            -DMR_PCH_USE_EXTRA_HEADERS=ON
            -DMRVOXELS_UNITY_BUILD=ON
            -DMESHLIB_BUILD_GENERATED_C_BINDINGS=ON
            -DMESHLIB_BUILD_JS_BINDINGS=ON
          MR_CMAKE_BUILD_OPTIONS: >
            --target MeshLibJS MeshLibJSNode
        run: ./scripts/build_source.sh

      - name: Test Wasm module
        run: |
          # The 64-bit module needs Memory64, which Node 22 only has behind a flag; the emsdk ships a newer Node.
          NODE=$(ls -d ${EMSDK}/node/*/bin/node 2>/dev/null | sort -V | tail -1)
          NODE=${NODE:-node}
          ${NODE} --version
          ${NODE} ${{ matrix.wasm64 == 1 && '--experimental-wasm-memory64' || '' }} source/MRTestJS/main.mjs source/MeshLibJS/${{ matrix.js-dir }}/index.mjs

      - name: Assemble and pack npm package
        if: ${{ matrix.wasm64 == 0 }}
        run: |
          scripts/npm/assemble.sh ${{ matrix.wasm-module-name }} "${{ inputs.app_version }}"
          npm pack ./npm-distr/${{ matrix.wasm-module-name }}
          for TGZ in meshinspector-*.tgz ; do mv "${TGZ}" "js-${TGZ#meshinspector-}" ; done

      - name: Build and run TypeScript example
        if: ${{ matrix.wasm64 == 0 }}
        working-directory: examples/typescript
        run: |
          sed -i "s|@meshinspector/meshlib|@meshinspector/${{ matrix.wasm-module-name }}|g" main.ts package.json
          npm install --no-audit --no-fund --no-save ../../js-${{ matrix.wasm-module-name }}-*.tgz
          npm start

      - name: Upload npm package
        if: ${{ inputs.upload_artifacts && matrix.wasm64 == 0 }}
        uses: actions/upload-artifact@v7
        with:
          name: Distributives_web_${{ matrix.wasm-module-name }}
          path: js-meshlib-*.tgz
          retention-days: 1

      - name: Upload the 64-bit module
        if: ${{ inputs.upload_artifacts && matrix.wasm64 == 1 }}
        uses: actions/upload-artifact@v7
        with:
          name: Distributives_web_${{ matrix.wasm-module-name }}
          path: source/MeshLibJS/js64
          retention-days: 1

  emscripten-test:
    needs: emscripten-build
    timeout-minutes: 10
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        package_name:
          - emscripten-singlethreaded
          - emscripten-multithreaded
          - emscripten-multithreaded-64bit

    steps:
      - name: Download MRTest bundle
        uses: actions/download-artifact@v8
        with:
          name: MRTest_${{ matrix.package_name }}
          path: mrtest-bundle
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      - name: Unit Tests
        timeout-minutes: 5
        working-directory: mrtest-bundle
        run: |
          python3 emrun.py \
            --browser=/usr/bin/firefox \
            --browser-args="--headless" \
            --safe-firefox-profile \
            --kill-exit \
            ./MRTest.html
