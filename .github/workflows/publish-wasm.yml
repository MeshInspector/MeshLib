name: Publish Wasm module

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      release_tag:
        required: true
        type: string
      draft:
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      draft:
        required: false
        type: boolean
        default: true

env:
  TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
  IS_DRAFT: ${{ inputs.draft || false }}

jobs:
  cdn:
    permissions:
      id-token: write   # OIDC -> AWS
      contents: write   # download the draft release asset
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::662635244517:role/GitHubMeshLibCdn
          aws-region: us-east-1

      - name: Download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${TAG}" --pattern "js-meshlib-*.tgz" --repo ${{ github.repository }} --clobber

        # The package is a directory of ES modules (`index.mjs`, `ffi.mjs`, `lib/`, `ns/`), declarations and the wasm modules,
        # uploaded as a whole: `https://js.meshlib.io/<package>/index.mjs` is the entry point, and the modules import each other relatively.
      - name: Upload to S3
        env:
          BUCKET: s3://cdn-meshlib-js
        run: |
          for TGZ in js-meshlib-*.tgz ; do
            NAME=${TGZ#js-}            # meshlib-1.2.3-4.tgz
            NAME=${NAME%%-[0-9]*}      # meshlib, meshlib-mt
            mkdir -p "pkg/${NAME}"
            tar -xzf "${TGZ}" --strip-components=1 -C "pkg/${NAME}"
            rm -f "pkg/${NAME}/package.json"
          done
          content_type() {
            case "$1" in
              *.mjs) echo text/javascript ;;
              *.wasm) echo application/wasm ;;
              *.d.mts) echo text/plain ;;
              *) echo application/octet-stream ;;
            esac
          }
          upload() {
            local name="$1" dest="$2" ; shift 2
            ( cd "pkg/${name}" && find . -type f -print0 ) | while IFS= read -r -d '' f ; do
              f=${f#./}
              gzip -9 -c "pkg/${name}/${f}" | aws s3 cp - "${dest}/${f}" --content-type "$(content_type "${f}")" --content-encoding gzip "$@"
            done
          }
          for f in meshlib meshlib-mt ; do
            [ -d "pkg/${f}" ] || continue
            if [ "${IS_DRAFT}" = "true" ] ; then
              upload "${f}" "${BUCKET}/${f}-draft"  --cache-control "public, max-age=300"
            else
              upload "${f}" "${BUCKET}/${f}@${TAG}" --cache-control "public, max-age=31536000, immutable"
              upload "${f}" "${BUCKET}/${f}"        --cache-control "public, max-age=300"
            fi
          done

      - name: Invalidate draft
        if: ${{ env.IS_DRAFT == 'true' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CDN_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/meshlib-draft/*" "/meshlib-mt-draft/*"

      - name: Invalidate latest
        if: ${{ env.IS_DRAFT != 'true' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CDN_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/meshlib/*" "/meshlib-mt/*"

  npm:
    permissions:
      id-token: write   # OIDC -> npm trusted publishing
      contents: write   # download the draft release asset
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24   # staged publishing needs npm >= 11.15
          registry-url: https://registry.npmjs.org

      - name: Download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${TAG}" --pattern "js-meshlib-*.tgz" --repo ${{ github.repository }} --clobber

      - name: Publish npm packages
        run: |
          if [ "${IS_DRAFT}" = "true" ] ; then
            ARGS="--dry-run"
          else
            ARGS="--provenance"
          fi
          for TGZ in js-meshlib-*.tgz ; do
            npm stage publish "./${TGZ}" --access public --tag latest ${ARGS}
          done
