name: Test Nuget package with .NET consumers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to test'
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  nuget-consumer-test:
    name: NuGet consumer test (${{ matrix.rid }}, ${{ matrix.frameworks }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # One job per runtimes/<rid>/native folder of the package; net47 runs on Windows only
        include:
          - rid: win-x64
            arch: x64
            runner: windows-2025
            frameworks: net47 net10.0
          - rid: win-arm64
            arch: ARM64
            runner: windows-11-vs2026-arm
            frameworks: net47 net10.0
          - rid: linux-x64
            arch: x64
            runner: ubuntu-24.04
            frameworks: net10.0
          - rid: linux-arm64
            arch: ARM64
            runner: ubuntu-24.04-arm
            frameworks: net10.0
          - rid: osx-x64
            arch: x64
            runner: macos-12-intel
            frameworks: net10.0
          - rid: osx-arm64
            arch: ARM64
            runner: macos-13
            frameworks: net10.0
    timeout-minutes: 30
    env:
      PROJECT_DIR: test_nuget/NugetTestProj
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      # bash, not pwsh: the self-hosted macOS runners have no PowerShell
      - name: Download nuget package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/retry.sh -- gh release download ${{ inputs.release_tag }} --pattern "*.nupkg" --repo ${{ github.repository }} --clobber

      - name: Put package into local NuGet feed
        id: feed
        shell: bash
        run: |
          pkg=$(ls MeshLib*.nupkg 2>/dev/null | head -n 1)
          if [ -z "$pkg" ]; then
            echo "::error::No MeshLib*.nupkg file found"
            exit 1
          fi
          pkgVersion=$(echo "$pkg" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          if [ -z "$pkgVersion" ]; then
            echo "::error::Cannot extract version from $pkg"
            exit 1
          fi
          mkdir -p "$PROJECT_DIR/nuget_repo"
          mv "$pkg" "$PROJECT_DIR/nuget_repo/MeshLib.$pkgVersion.nupkg"
          echo "package_version=$pkgVersion" >> "$GITHUB_OUTPUT"

      - name: Build consumers
        shell: bash
        run: |
          for tfm in ${{ matrix.frameworks }}; do
            dotnet build "$PROJECT_DIR" -c Release -f $tfm -p:MeshLibVersion=${{ steps.feed.outputs.package_version }} -p:PlatformTarget=${{ matrix.arch }}
          done

      - name: Run consumers
        shell: bash
        run: |
          exitCode=0
          for tfm in ${{ matrix.frameworks }}; do
            out="$PROJECT_DIR/bin/Release/$tfm"
            if [ "$tfm" = net47 ]; then
              "$out/NugetTestProj.exe" || exitCode=$?
            else
              dotnet "$out/NugetTestProj.dll" || exitCode=$?
            fi
          done
          exit $exitCode
