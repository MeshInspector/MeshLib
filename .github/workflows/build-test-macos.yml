name: Build and test MacOS

on:
  workflow_call:
    inputs:
      app_version:
        required: true
        type: string
      full_config_build:
        default: false
        required: false
        type: boolean
      internal_build:
        required: false
        type: boolean
      upload_artifacts:
        required: true
        type: boolean
      upload_test_artifacts:
        required: true
        type: boolean
      mrbind:
        default: true
        required: false
        type: boolean
      mrbind_c:
        default: true
        required: false
        type: boolean
      nuget_build_patch:
        default: false
        required: false
        type: boolean
      vcpkg_version:
        required: true
        type: string

jobs:
  macos-build-test:
    timeout-minutes: 100
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [ x64, arm64 ]
        config: [ Debug, Release ]
        lib-source: [ Homebrew, vcpkg ]
        exclude:
          - arch: x64
            config: Debug
          - config: Debug
            lib-source: vcpkg
        include:
          - arch: x64
            config: Release
            compiler: AppleClang
            cxx-compiler-template: /usr/bin/clang++
            c-compiler-template: /usr/bin/clang
            # mrbind and the bindings use the PGO keg fetched from
            # MeshInspector/toolchains releases; the app stays on AppleClang.
            llvm-prefix-template: BREW_PREFIX/Cellar/llvm-pgo/22.1.8_2
            # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners/about-github-hosted-runners
            runner: macos-15-intel # github hosted
            instance: macos-15-intel
          - arch: arm64
            config: Release
            compiler: AppleClang
            cxx-compiler-template: /usr/bin/clang++
            c-compiler-template: /usr/bin/clang
            # mrbind and the bindings use the PGO keg fetched from
            # MeshInspector/toolchains releases; the app stays on AppleClang.
            llvm-prefix-template: BREW_PREFIX/Cellar/llvm-pgo/22.1.8_2
            # Pinned to the same image pip-build.yml uses so the mrbind cache is shared.
            runner: macos-14
            instance: macos-14
          - arch: arm64
            config: Debug
            compiler: brew-llvm22
            # The -O3+PGO+ThinLTO keg, built on each runner via the local/pgo
            # tap (llvm.rb with ENV.O3, installed with --build-bottle).
            llvm-prefix-template: BREW_PREFIX/Cellar/llvm-pgo/22.1.8_2
            cxx-compiler-template: BREW_PREFIX/Cellar/llvm-pgo/22.1.8_2/bin/clang++
            c-compiler-template: BREW_PREFIX/Cellar/llvm-pgo/22.1.8_2/bin/clang
            runner: [ self-hosted, macos, arm64, build ] #  any macos version
            instance: self-hosted-arm
          - lib-source: Homebrew
            python-version: '3.10'
          - lib-source: vcpkg
            python-version: '3.12'
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read  # This is required for actions/checkout
      actions: read   # This is required for wait-for-job
    steps:
      # GitHub-hosted runners enable Spotlight by default
      # https://github.com/actions/runner-images/discussions/5032
      - name: Disable Spotlight indexing
        if: ${{ runner.environment == 'github-hosted' }}
        run: sudo mdutil -a -i off

      - name: Checkout
        uses: actions/checkout@v7

      - name: macOS Diagnostics
        uses: ./.github/actions/macos-diagnostics

      # LLVM_PREFIX selects the LLVM keg for the build and the mrbind scripts;
      # resolved per machine since the self-hosted label set spans runners
      # with different homebrew prefixes.
      - name: Resolve LLVM prefix
        if: ${{ matrix.llvm-prefix-template }}
        run: echo "LLVM_PREFIX=$(echo '${{ matrix.llvm-prefix-template }}' | sed "s|BREW_PREFIX|$(brew --prefix)|")" >> $GITHUB_ENV

      - name: Resolve compiler paths
        id: compilers
        run: |
          BREW_PREFIX=$(brew --prefix)
          echo "cxx-compiler=$(echo '${{ matrix.cxx-compiler-template }}' | sed "s|BREW_PREFIX|$BREW_PREFIX|")" >> $GITHUB_OUTPUT
          echo "c-compiler=$(echo '${{ matrix.c-compiler-template }}' | sed "s|BREW_PREFIX|$BREW_PREFIX|")" >> $GITHUB_OUTPUT

      - name: Compute Homebrew path hash
        id: brew-hash
        run: |
          BREW_HASH=$(printf %s "$(brew --prefix)" | shasum -a 256 | cut -c1-16)
          echo "brew-hash=${BREW_HASH}" >> $GITHUB_OUTPUT

      - name: Checkout third-party submodules
        run: |
          # Selective init -- parent Checkout drops submodules:true.
          # https://github.com/actions/checkout/issues/1779
          # Retried via retry.sh: submodule endpoints occasionally 500.
          bash scripts/retry.sh --timeout 300 -- scripts/clone_submodules_macos.sh

      - name: Install llvm-pgo keg
        if: ${{ contains(matrix.llvm-prefix-template, 'llvm-pgo') }}
        uses: ./.github/actions/install-llvm-pgo-keg

      - name: Install thirdparty libs
        if: ${{ matrix.lib-source == 'Homebrew' }}
        id: thirdparty
        uses: ./.github/actions/install-macos-thirdparty
        with:
          cache-instance: ${{ matrix.instance }}
          cache-compiler: ${{ matrix.compiler }}
          cxx-compiler: ${{ steps.compilers.outputs.cxx-compiler }}
          c-compiler: ${{ steps.compilers.outputs.c-compiler }}

      - name: Configure AWS Credentials
        if: ${{ matrix.lib-source == 'vcpkg' && inputs.internal_build }}
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::259351611210:role/GitHubMeshLibAwsCredsRole
          aws-region: us-east-1
          role-duration-seconds: 7200
          retry-max-attempts: 5

      - name: Build thirdparty libs
        if: ${{ matrix.lib-source == 'vcpkg' }}
        env:
          VCPKG_VERSION: ${{ inputs.vcpkg_version }}
        run: |
          export VCPKG_TRIPLET=$(scripts/detect_vcpkg_triplet.sh)
          source thirdparty/vcpkg/configure_s3_cache.sh
          scripts/build_vcpkg_thirdparty.sh
          echo "VCPKG_TRIPLET=${VCPKG_TRIPLET}" >> $GITHUB_ENV

      - name: Thirdparty footprint
        run: |
          for dir in vcpkg_installed /usr/local/share/vcpkg/packages ; do
            if [ -d "${dir}" ] ; then
              echo "$(du -sh "${dir}" | cut -f 1) $(find "${dir}" | wc -l | tr -d ' ') files ${dir}"
            fi
          done

      - name: Collect runner's system stats
        if: ${{ inputs.internal_build }}
        id: collect-runner-stats
        continue-on-error: true
        uses: ./.github/actions/collect-runner-stats
        with:
          target_os: macos
          target_arch: ${{ matrix.arch }}
          cxx_compiler: ${{ steps.compilers.outputs.cxx-compiler }}
          build_config: ${{ matrix.config }}

      - name: Install MRBind deps
        if: ${{ inputs.mrbind || inputs.mrbind_c }}
        env:
          HOMEBREW_NO_INSTALL_UPGRADE: '1'   # don't upgrade an already-installed llvm/lld, no z3, no rebuild
          HOMEBREW_NO_INSTALL_CLEANUP: '1'   # don't prune the known-good keg
        run: ./scripts/mrbind/install_deps_macos.sh

      - name: Build MRBind
        if: ${{ inputs.mrbind || inputs.mrbind_c }}
        uses: ./.github/actions/build-mrbind
        with:
          # Keyed on the runner image (matrix.instance) plus the brew-prefix hash
          # to discriminate between fleet members of the self-hosted ARM label set.
          # Shared with pip-build.yml's macOS section where the two also match.
          cache-key-prefix: ${{ matrix.instance }}-clang
          build-script: scripts/mrbind/install_mrbind_macos.sh
          extra-cache-key: ${{ matrix.llvm-prefix-template }}${{ hashFiles('scripts/mrbind/clang_version_macos.txt') }}-${{ steps.brew-hash.outputs.brew-hash }}

      - name: Create virtualenv
        run: |
          if [ "${{ matrix.lib-source }}" = "vcpkg" ] ; then
            PATH="$PWD/vcpkg_installed/${VCPKG_TRIPLET}/tools/python3:$PATH"
          fi
          python${{ matrix.python-version }} -m venv .venv
          . .venv/bin/activate
          echo PATH=$PATH >> $GITHUB_ENV

      - name: Setup python requirements
        run: |
          curl -sS https://bootstrap.pypa.io/get-pip.py | python3
          python3 -m pip install -r ./requirements/python/requirements.txt
          python3 -m pip install pytest

      - name: Build
        run: ./scripts/build_source.sh
        env:
          MESHLIB_BUILD_RELEASE: ${{ fromJSON('["OFF", "ON"]')[matrix.config == 'Release'] }}
          MESHLIB_BUILD_DEBUG: ${{ fromJSON('["OFF", "ON"]')[matrix.config == 'Debug'] }}
          MESHLIB_USE_VCPKG: ${{ fromJSON('["OFF", "ON"]')[matrix.lib-source == 'vcpkg'] }}
          VCPKG_MANIFEST_MODE: 'ON'
          CMAKE_CXX_COMPILER: ${{ steps.compilers.outputs.cxx-compiler }}
          MR_VERSION: ${{ inputs.app_version }}
          MR_CMAKE_OPTIONS: >
            -DMESHLIB_BUILD_MRMESH_PY_LEGACY=${{ fromJSON('["ON", "OFF"]')[inputs.mrbind] }}
            -DMR_CXX_STANDARD=23
            -DMESHLIB_BUILD_GENERATED_C_BINDINGS=OFF
            -DMR_PCH_USE_EXTRA_HEADERS=ON

      - name: Wait for C bindings
        if: ${{ inputs.mrbind_c }}
        uses: ./.github/actions/wait-for-job
        with:
          job-name: generate-c-bindings

      - name: Download C bindings
        if: ${{ inputs.mrbind_c }}
        uses: actions/download-artifact@v8
        with:
          name: CBindings
          path: MeshLib/CbindingsTmp

      - name: Prepare C bindings folders
        if: ${{ inputs.mrbind_c }}
        run: |
          rm -rf source/MeshLibC2
          mv MeshLib/CbindingsTmp/MeshLibC2 source
          # Cuda placeholders:
          cp -R scripts/mrbind/cuda_placeholder_generated_c/{include,src} source/MeshLibC2Cuda

      - name: Build C bindings
        if: ${{ inputs.mrbind_c }}
        env:
          MR_VERSION: ${{ inputs.app_version }}
        run: |
          cmake -S . -B build/${{ matrix.config }} -DMESHLIB_BUILD_GENERATED_C_BINDINGS=ON
          cmake --build build/${{ matrix.config }} -j $(sysctl -n hw.logicalcpu) --target MeshLibC2 MeshLibC2Cuda MRTestC2

      - name: Upload build timings
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: NinjaLog-macos-${{ matrix.arch }}-${{ matrix.config }}-${{ matrix.lib-source }}
          path: build/${{ matrix.config }}/.ninja_log
          retention-days: 7
          if-no-files-found: ignore

      - name: MRMesh Exported Symbols
        run: |
          if [[ -n "${LLVM_PREFIX:-}" ]]; then
            export PATH="$LLVM_PREFIX/bin:$PATH"
          else
            export PATH="$(brew --prefix llvm@22)/bin:$PATH"
          fi
          nm -gU ./build/${{ matrix.config }}/bin/libMRMesh.dylib | llvm-cxxfilt

      - name: Generate and build Python bindings
        if: ${{ inputs.mrbind }}
        env:
          CXX: ${{ steps.compilers.outputs.cxx-compiler }}
        run: |
          export PATH="$(brew --prefix)/opt/make/libexec/gnubin:$(brew --prefix)/opt/grep/libexec/gnubin:$PATH"
          make --version
          if [ "${{ matrix.lib-source }}" = "vcpkg" ] ; then
            export PKG_CONFIG_LIBDIR="$PWD/vcpkg_installed/${VCPKG_TRIPLET}/lib/pkgconfig"
            DEPS_BASE_DIR="vcpkg_installed/${VCPKG_TRIPLET}"
          else
            DEPS_BASE_DIR=.
          fi
          # No distribution carries these; only this job's own tests use them.
          make -f scripts/mrbind/generate.mk \
            -B --trace \
            MODE=none \
            PYTHON_PKGCONF_NAME=python-${{ matrix.python-version }}-embed \
            MESHLIB_SHLIB_DIR=build/${{matrix.config}}/bin \
            DEPS_BASE_DIR=${DEPS_BASE_DIR}

      - name: Run Start-and-Exit Tests
        timeout-minutes: 3
        run: ./build/${{ matrix.config }}/bin/MeshViewer -tryHidden -noEventLoop -unloadPluginsAtEnd

      - name: Verify meshlib.mrmeshpy import
        if: ${{ inputs.mrbind }}
        timeout-minutes: 3
        uses: ./.github/actions/verify-meshlib-python-import
        with:
          build-bin-dir: ./build/${{ matrix.config }}/bin

      - name: Unit Tests
        env:
          GTEST_OUTPUT: 'xml:unit_tests_report_gtest.xml'
        timeout-minutes: 10
        run: ./build/${{ matrix.config }}/bin/MRTest --with-python-tests

      - name: C Unit Tests
        if: ${{ inputs.mrbind_c }}
        timeout-minutes: 10
        run: ./build/${{ matrix.config }}/bin/MRTestC2

      - name: Python Sanity Tests
        timeout-minutes: 8
        working-directory: ./build/${{ matrix.config }}/bin
        run: python3 -u ./../../../scripts/run_python_test_script.py -d '../test_python' -a ' --junit-xml=../unit_tests_report_pytest.xml'

      - name: Python Regression Tests
        if: ${{ inputs.internal_build }}
        env:
          RUN_CUDA_ARG: "--run-cuda=negative --junit-xml=../unit_tests_report_regression.xml"
        uses: ./.github/actions/python-regression-tests
        with:
          build_config: ${{ matrix.config }}
          smoke: ${{ !inputs.full_config_build && matrix.config == 'Debug' }}
          test_artifacts_path: macos/${{ matrix.arch }}
          upload_test_artifacts: ${{ inputs.upload_test_artifacts }}

      - name: Generate Test Performance Report
        continue-on-error: true
        run: |
          scripts/junit_to_csv.py unit_tests_report.csv unit_tests_report_*.xml
          cat unit_tests_report.csv

      - name: Create Pkg
        if: ${{ matrix.config == 'Release' }}
        run: |
          if [ "${{ matrix.lib-source }}" = "vcpkg" ] ; then
            ./scripts/distribution_vcpkg_macos.sh ${{ inputs.app_version }}
          else
            ./scripts/distribution_apple.sh ${{ inputs.app_version }}
          fi
          mv MeshLib_.pkg meshlib_${{matrix.arch}}.pkg

      - name: Extract Pkg
        if: ${{ matrix.config == 'Release' }}
        run: |
          # https://gist.github.com/ugultopu/1adf8e08acb87be649d69419cf7aca3c
          pkgutil --expand meshlib_${{ matrix.arch }}.pkg ./meshlib_install
          cd ./meshlib_install/MeshLib.pkg
          cat Payload | gunzip | cpio -i

      - name: Build C++ examples
        if: ${{ matrix.config == 'Release' }}
        env:
          CXX: ${{ steps.compilers.outputs.cxx-compiler }}
        run: |
          cmake \
            -S examples/cpp-examples \
            -B cpp-examples-build \
            -D CMAKE_FRAMEWORK_PATH=$(pwd)/meshlib_install/MeshLib.pkg/Frameworks/
          cmake \
            --build cpp-examples-build \
            --parallel $(sysctl -n hw.physicalcpu)

      - name: Build C examples
        if: ${{ matrix.config == 'Release' }}
        env:
          CC: ${{ steps.compilers.outputs.c-compiler }}
        run: |
          cmake \
            -S examples/c-examples \
            -B c-examples-build \
            -D CMAKE_FRAMEWORK_PATH=$(pwd)/meshlib_install/MeshLib.pkg/Frameworks/
          cmake \
            --build c-examples-build \
            --parallel $(sysctl -n hw.physicalcpu)
          ./c-examples-build/MeshModification

      - name: Upload Macos Distribution
        if: ${{ inputs.upload_artifacts && matrix.config == 'Release' && matrix.lib-source == 'Homebrew' }}
        env:
          ACTIONS_ARTIFACT_UPLOAD_TIMEOUT_MS: 1800000
        uses: actions/upload-artifact@v7
        with:
          name: Distributives_macos-${{matrix.arch}}
          path: meshlib_${{matrix.arch}}.pkg
          retention-days: 1
          overwrite: true

      - name: Collect artifact stats
        # Mirror `Upload Macos Distribution`'s gate -- otherwise Debug jobs
        # invoke this step with no matching .pkg and the action fails (with
        # `continue-on-error: true` the job still succeeds, but a confusing
        # `failure`-level annotation is surfaced on the run summary).
        if: ${{ inputs.internal_build && inputs.upload_artifacts && matrix.config == 'Release' && matrix.lib-source == 'Homebrew' }}
        continue-on-error: true
        uses: ./.github/actions/collect-artifact-stats
        with:
          artifact_path: ${{ github.workspace }}
          artifact_glob: meshlib_${{matrix.arch}}.pkg
          stats_file_suffix: -${{ steps.collect-runner-stats.outputs.job_id }}

      - name: Create and fix fake Wheel for NuGet
        if: ${{ inputs.nuget_build_patch && matrix.config == 'Release' && matrix.lib-source == 'Homebrew' }}
        shell: bash
        run: |
          python3 -m venv ./wheel_venv
          source ./wheel_venv/bin/activate
          python3 -m pip install delocate==0.10.7
          python3 ./scripts/nuget_patch/patch_library_deps.py ./patched_content/ ./build/Release/bin/lib{MeshLibC2,MeshLibC2Cuda}.dylib
          ./scripts/nuget_patch/fix_macos_rpath.sh ./patched_content/libMeshLibC2.dylib

      - name: Upload NuGet files to Artifacts
        if: ${{ inputs.nuget_build_patch && matrix.config == 'Release' && matrix.lib-source == 'Homebrew' }}
        uses: actions/upload-artifact@v7
        with:
          name: DotNetPatchArchiveMacOs-${{ matrix.arch }}
          path: ./patched_content/*
          retention-days: 1
          overwrite: true
