name: Python regression tests

inputs:
  build_config:
    description: "Build config (Release, Debug)"
    required: true
    type: string
  build_arch:
    description: "Windows only: arch segment of the output dir (x64, arm64)"
    required: false
    type: string
    default: x64
  pytest_args:
    description: "Additional pytest arguments"
    required: false
    type: string
    default: ""
  smoke:
    required: true
    type: boolean
  test_artifacts_path:
    description: "S3 path for test artifacts. Make sure it is unique for different jobs"
    required: true
    type: string
  upload_test_artifacts:
    required: true
    type: boolean

runs:
  using: composite
  steps:
    - name: Debug inputs
      if: ${{ runner.os != 'Windows' }}
      shell: bash
      run: |
        echo << EOF
        build_config: ${{ inputs.build_config }}
        pytest_args: ${{ inputs.pytest_args }}
        smoke: ${{ inputs.smoke }}
        test_artifacts_path: ${{ inputs.test_artifacts_path }}
        upload_test_artifacts: ${{ inputs.upload_test_artifacts }}
        EOF

    - name: Debug inputs (Windows)
      if: ${{ runner.os == 'Windows' }}
      shell: powershell
      run: |
        Write-Output "build_config: ${{ inputs.build_config }}"
        Write-Output "pytest_args: ${{ inputs.pytest_args }}"
        Write-Output "smoke: ${{ inputs.smoke }}"
        Write-Output "test_artifacts_path: ${{ inputs.test_artifacts_path }}"
        Write-Output "upload_test_artifacts: ${{ inputs.upload_test_artifacts }}"

    # test_data is declared with `update = none`, so fetch it explicitly with --checkout.
    - name: Fetch test data submodule
      shell: bash
      run: |
        # Linux jobs run in containers and need safe.directory set first.
        if [ "$RUNNER_OS" = "Linux" ]; then
          export HOME="${RUNNER_TEMP}"
          git config --global --add safe.directory '*'
        fi
        bash scripts/retry.sh --timeout 300 -- git submodule update --init --checkout --depth 1 test_data

    - name: Python Regression Tests
      if: ${{ runner.os != 'Windows' }}
      shell: bash
      working-directory: build/${{ inputs.build_config }}/bin
      run: >
        python3 ../../../scripts/run_python_test_script.py
        -d '../test_regression'
        -s ${{ inputs.smoke }}
        -a='${{ inputs.pytest_args }}'

    - name: Python Regression Tests (Windows)
      if: ${{ runner.os == 'Windows' && inputs.build_config != 'Debug' }}
      shell: powershell
      working-directory: source\${{ inputs.build_arch }}\${{ inputs.build_config }}
      run: >
        py -3 ..\..\..\scripts\run_python_test_script.py
        -d '..\test_regression'
        -s ${{ inputs.smoke }}
        -a='${{ inputs.pytest_args }}'

    # cdb follows the py launcher's child interpreters (-o) and, on any break,
    # reads "~*kv" then "q" from stdin, so a crash prints every thread's stack.
    # A run still alive after ten minutes is broken into with DebugBreakProcess,
    # which yields the same stacks for a hang.
    - name: Python Regression Tests (Windows, Debug, under cdb)
      if: ${{ runner.os == 'Windows' && inputs.build_config == 'Debug' }}
      shell: pwsh
      working-directory: source\${{ inputs.build_arch }}\${{ inputs.build_config }}
      run: |
        $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'arm64' } else { 'x64' }
        $cdb = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\$arch\cdb.exe"
        if (-not (Test-Path $cdb)) { throw "cdb.exe not found: $cdb" }
        $onBreak = Join-Path $env:RUNNER_TEMP 'cdb-on-break.txt'
        Set-Content -Path $onBreak -Value "~*kv`nq"
        $cdbArgs = @(
          '-g', '-G', '-o',
          'py', '-3', '..\..\..\scripts\run_python_test_script.py',
          '-d', '..\test_regression',
          '-s', '${{ inputs.smoke }}',
          "-a=`"${{ inputs.pytest_args }}`""
        )
        $run = Start-Process -FilePath $cdb -ArgumentList $cdbArgs -NoNewWindow -PassThru -RedirectStandardInput $onBreak
        if (-not $run.WaitForExit(600000)) {
          Write-Host '::warning::regression run still alive after 10 minutes; breaking into every python process for stacks'
          Add-Type -Namespace Win32 -Name Kernel32 -MemberDefinition '[DllImport("kernel32.dll", SetLastError = true)] public static extern bool DebugBreakProcess(System.IntPtr hProcess);'
          foreach ($python in Get-Process -Name python -ErrorAction SilentlyContinue) {
            $ok = [Win32.Kernel32]::DebugBreakProcess($python.Handle)
            Write-Host "DebugBreakProcess(pid $($python.Id)): $ok"
          }
          if (-not $run.WaitForExit(120000)) { Stop-Process -Id $run.Id -Force }
          exit 1
        }
        exit $run.ExitCode

    - name: Configure AWS Credentials
      if: ${{ fromJSON( inputs.upload_test_artifacts ) && !cancelled() }}
      uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
      with:
        role-to-assume: arn:aws:iam::259351611210:role/GitHubMeshLibAwsCredsRole
        aws-region: us-east-1
        retry-max-attempts: 5

    - name: Copy test artifacts to S3
      if: ${{ fromJSON( inputs.upload_test_artifacts ) && !cancelled() && runner.os != 'Windows' }}
      shell: bash
      run: aws s3 cp pytest_temp 's3://test-artifacts-git/tests/${{ github.run_id }}/${{ inputs.test_artifacts_path }}' --recursive --quiet

    - name: Copy test artifacts to S3 (Windows)
      if: ${{ fromJSON( inputs.upload_test_artifacts ) && !cancelled() && runner.os == 'Windows' }}
      shell: powershell
      run: aws s3 cp pytest_temp 's3://test-artifacts-git/tests/${{ github.run_id }}/${{ inputs.test_artifacts_path }}' --recursive --quiet
