name: Publish Wasm module

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      release_tag:
        required: true
        type: string
      draft:
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      draft:
        required: false
        type: boolean
        default: true

env:
  TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
  IS_DRAFT: ${{ inputs.draft || false }}

jobs:
  cdn:
    permissions:
      id-token: write   # OIDC -> AWS
      contents: write   # download the draft release asset
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::662635244517:role/GitHubMeshLibCdn
          aws-region: us-east-1

      - name: Download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${TAG}" --pattern "js-meshlib-*.tgz" --repo ${{ github.repository }} --clobber

        # The package is a directory of ES modules (`index.mjs`, `ffi.mjs`, `lib/`, `ns/`) importing each other, which the bundlers
        # tree-shake; from a CDN that would be ~1100 requests, so here they're bundled into one `index.mjs` (esbuild, whitespace and
        # syntax minified, the identifiers kept for readable stack traces). The Emscripten glue and the wasm stay separate files:
        # the glue locates the wasm from its own URL, and the workers of the multithreaded build load it by URL. The three go
        # under `<package>@<tag>/`, gzipped once into a staging tree and uploaded per content type. The Node build and the
        # declarations are useless from a CDN and are skipped.
        # `<package>/index.mjs` (the unpinned entry point) only re-exports the tagged tree: replacing the files in place would let
        # a client mix the new `index.mjs` with the cached old glue or wasm.
      - name: Upload to S3
        env:
          BUCKET: s3://cdn-meshlib-js
        run: |
          for TGZ in js-meshlib-*.tgz ; do
            NAME=${TGZ#js-}            # meshlib-1.2.3-4.tgz
            NAME=${NAME%%-[0-9]*}      # meshlib, meshlib-mt
            mkdir -p "src/${NAME}" "pkg/${NAME}"
            tar -xzf "${TGZ}" --strip-components=1 -C "src/${NAME}"
            npx --yes esbuild@0.25 "src/${NAME}/index.mjs" --bundle --format=esm --platform=neutral --minify-whitespace --minify-syntax \
              --external:./MeshLibC2.mjs --external:./MeshLibC2.node.mjs --log-level=warning --outfile="pkg/${NAME}/index.mjs"
            cp "src/${NAME}/MeshLibC2.mjs" "src/${NAME}/MeshLibC2.wasm" "src/${NAME}/README.md" "src/${NAME}/LICENSE" "pkg/${NAME}/"
            find "pkg/${NAME}" -type f -exec gzip -9 -n {} \;
            find "pkg/${NAME}" -type f -name '*.gz' -exec sh -c 'mv "$1" "${1%.gz}"' _ {} \;
          done
          # One recursive upload per content type.
          upload() {
            local src="$1" dest="$2" ; shift 2
            aws s3 cp "${src}" "${dest}" --recursive --only-show-errors --content-encoding gzip --exclude '*' --include '*.mjs'  --content-type text/javascript  "$@"
            aws s3 cp "${src}" "${dest}" --recursive --only-show-errors --content-encoding gzip --exclude '*' --include '*.wasm' --content-type application/wasm "$@"
            aws s3 cp "${src}" "${dest}" --recursive --only-show-errors --content-encoding gzip --exclude '*' --include '*.md'   --content-type text/markdown    "$@"
            aws s3 cp "${src}" "${dest}" --recursive --only-show-errors --content-encoding gzip --exclude '*' --include 'LICENSE' --content-type text/plain      "$@"
          }
          for f in meshlib meshlib-mt ; do
            [ -d "pkg/${f}" ] || continue
            if [ "${IS_DRAFT}" = "true" ] ; then
              upload "pkg/${f}" "${BUCKET}/${f}-draft" --cache-control "public, max-age=300"
            else
              upload "pkg/${f}" "${BUCKET}/${f}@${TAG}" --cache-control "public, max-age=31536000, immutable"
              printf 'export * from "../%s@%s/index.mjs";\n' "${f}" "${TAG}" | gzip -9 -n | aws s3 cp - "${BUCKET}/${f}/index.mjs" --content-type text/javascript --content-encoding gzip --cache-control "public, max-age=300"
            fi
          done

      - name: Invalidate draft
        if: ${{ env.IS_DRAFT == 'true' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CDN_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/meshlib-draft/*" "/meshlib-mt-draft/*"

      - name: Invalidate latest
        if: ${{ env.IS_DRAFT != 'true' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CDN_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/meshlib/index.mjs" "/meshlib-mt/index.mjs"

  npm:
    permissions:
      id-token: write   # OIDC -> npm trusted publishing
      contents: write   # download the draft release asset
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24   # staged publishing needs npm >= 11.15
          registry-url: https://registry.npmjs.org

      - name: Download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${TAG}" --pattern "js-meshlib-*.tgz" --repo ${{ github.repository }} --clobber

      - name: Publish npm packages
        run: |
          if [ "${IS_DRAFT}" = "true" ] ; then
            ARGS="--dry-run"
          else
            ARGS="--provenance"
          fi
          for TGZ in js-meshlib-*.tgz ; do
            npm stage publish "./${TGZ}" --access public --tag latest ${ARGS}
          done
