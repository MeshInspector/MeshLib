name: Build Rust bindings
description: >
  Installs Rust if needed, generates the Rust bindings from the C bindings
  (`make -f scripts/mrbind/generate.mk TARGET=rust`, which also builds the
  crate), then builds and runs the Rust examples and tests against the
  freshly built C libraries. The C bindings must have been built already.

inputs:
  lib-dir:
    required: true
    description: >
      Absolute path of the directory with the MeshLib and MeshLibC2 shared
      libraries, for linking and for the dynamic loader when running.
  artifact-name:
    required: false
    default: ''
    description: >
      The name of the artifact with the generated crate. The default is
      `RustBindings-<os>-<arch>`, pass something else when several jobs of
      the workflow share those.
  windows-vsdevcmd:
    required: false
    default: ''
    description: >
      Windows only: the `call ...\VsDevCmd.bat ...` command that sets up the
      MSVC environment for `generate_win.bat`.

runs:
  using: composite
  steps:
    - name: Install Rust
      uses: ./.github/actions/setup-rust

    - name: Generate and build Rust bindings
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -eu
        if [ "$RUNNER_OS" = macOS ]; then
          export PATH="$(brew --prefix)/opt/make/libexec/gnubin:$(brew --prefix)/opt/grep/libexec/gnubin:$PATH"
        fi
        make -f scripts/mrbind/generate.mk -B --trace TARGET=rust

    - name: Generate and build Rust bindings (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      env:
        MSYS2_DIR: C:\msys64
      run: |
        ${{ inputs.windows-vsdevcmd }} || exit /b 1
        call ./scripts/mrbind/generate_win.bat -B --trace TARGET=rust || exit /b 1

    - name: Build and run Rust examples and tests
      if: runner.os != 'Windows'
      shell: bash
      env:
        MESHLIB_LIB_DIR: ${{ inputs.lib-dir }}
        LD_LIBRARY_PATH: ${{ inputs.lib-dir }}
        DYLD_LIBRARY_PATH: ${{ inputs.lib-dir }}
      run: |
        set -eu
        cargo build --manifest-path examples/rust-examples/Cargo.toml
        ./examples/rust-examples/target/debug/MeshBoolean
        cargo test --manifest-path source/MRTestRust/Cargo.toml

    # The crate must come out the same on every platform. `upload-distributions` compares them and publishes one.
    - name: Upload the generated crate
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name || format('RustBindings-{0}-{1}', runner.os, runner.arch) }}
        path: |
          source/MeshLibRust/Cargo.toml
          source/MeshLibRust/build.rs
          source/MeshLibRust/src
        retention-days: 1

    - name: Build and run Rust examples and tests (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      env:
        MESHLIB_LIB_DIR: ${{ inputs.lib-dir }}
      run: |
        ${{ inputs.windows-vsdevcmd }} || exit /b 1
        cargo build --manifest-path examples/rust-examples/Cargo.toml || exit /b 1
        set PATH=${{ inputs.lib-dir }};%PATH%
        examples\rust-examples\target\debug\MeshBoolean.exe || exit /b 1
        cargo test --manifest-path source/MRTestRust/Cargo.toml || exit /b 1
