[build-system]
requires = ["setuptools >= 77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meshlib"
description = "3d processing library"
authors = [
    { name = "MeshLib Team", email = "support@meshinspector.com" },
]
readme = "readme.md"
license = "LicenseRef-MeshLib"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.txt"]
classifiers = [
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
]
requires-python = ">=3.8"
# dependencies live in setup.cfg (install_requires): the meshlib-viewer pin is versioned,
# and a static [project] dependencies list would silently override the setup.cfg one
dynamic = ["version", "dependencies"]

[project.urls]
Homepage = "https://meshlib.io/"
Documentation = "https://meshlib.io/documentation/"
Source = "https://github.com/MeshInspector/MeshLib"
"Bug Reports" = "https://github.com/MeshInspector/MeshLib/issues"
