name: Setup Java
description: >
  Makes a JDK 22 or newer (needed for the foreign function API the Java
  bindings use) available for the following steps. If the runner already has
  one, nothing is installed. Otherwise a Temurin JDK (Microsoft's build on
  Windows ARM64) is downloaded into the runner's temp directory, so self-hosted
  runners don't accumulate state.

inputs:
  version:
    description: The JDK feature version to download when the runner has none.
    default: '25'

runs:
  using: composite
  steps:
    - name: Install Java
      shell: bash
      run: |
        set -eu
        if command -v javac >/dev/null; then
          version=$(javac -version 2>&1 | sed -E 's/^javac ([0-9]+).*/\1/')
          if [ "$version" -ge 22 ]; then
            echo "Using the existing $(command -v javac), version $version"
            exit 0
          fi
        fi
        case "$RUNNER_OS" in
          Linux) os=linux ;;
          macOS) os=mac ;;
          Windows) os=windows ;;
          *) echo "Unknown OS $RUNNER_OS"; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          ARM64) arch=aarch64 ;;
          *) arch=x64 ;;
        esac
        dir="$RUNNER_TEMP/jdk"
        rm -rf "$dir"
        mkdir -p "$dir"
        url="https://api.adoptium.net/v3/binary/latest/${{ inputs.version }}/ga/$os/$arch/jdk/hotspot/normal/eclipse"
        if [ "$os-$arch" = windows-aarch64 ]; then
          # Temurin has no Windows ARM64 builds past 21, the Microsoft build of OpenJDK has.
          url="https://aka.ms/download-jdk/microsoft-jdk-${{ inputs.version }}-windows-aarch64.zip"
        fi
        if [ "$RUNNER_OS" = Windows ]; then
          curl -sSfL -o "$RUNNER_TEMP/jdk.zip" "$url"
          unzip -q "$RUNNER_TEMP/jdk.zip" -d "$dir"
        else
          curl -sSfL "$url" | tar -xzf - -C "$dir"
        fi
        home=$(echo "$dir"/jdk-*)
        if [ "$RUNNER_OS" = macOS ]; then
          home="$home/Contents/Home"
        fi
        if [ "$RUNNER_OS" = Windows ]; then
          # The JDK bundles a C++ runtime (msvcp140.dll and friends) that java.exe loads before anything else, and it can be older than
          # the one MeshLib was built with, which makes loading MeshLibC2.dll fail with "The specified procedure could not be found".
          # Without them java.exe uses the Visual C++ redistributable installed on the machine, which MeshLib needs anyway.
          rm -f "$home"/bin/msvcp140*.dll "$home"/bin/vcruntime140*.dll
          home=$(cygpath -w "$home")
          # `GITHUB_PATH` is fine here: the Windows jobs don't keep PATH in `GITHUB_ENV`.
          echo "$home\bin" >> "$GITHUB_PATH"
        else
          # The Ubuntu and macOS jobs keep PATH in `GITHUB_ENV` (see their "Create virtualenv" steps),
          # and a `GITHUB_PATH` entry would make the runner rebuild PATH without the virtualenv.
          echo "PATH=$home/bin:$PATH" >> "$GITHUB_ENV"
        fi
        echo "JAVA_HOME=$home" >> "$GITHUB_ENV"
        "$home/bin/java" -version
