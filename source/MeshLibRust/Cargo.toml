[package]
name = "meshlib"
# The release archives get the MeshLib version here (`3.1.4+528` for v3.1.4.528), see `scripts/pack_rust_crate.sh`. A local build has none.
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
build = "build.rs"

[lib]
path = "src/lib.rs"

# For downloading the MeshLib libraries, see `build.rs`.
[build-dependencies]
sha2 = "0.11"
ureq = "3"
zip = {version = "9", default-features = false, features = ["deflate"]}
