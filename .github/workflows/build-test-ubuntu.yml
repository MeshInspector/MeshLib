name: Build and test Ubuntu

on:
  workflow_call:
    inputs:
      arch:
        description: x64 or arm64
        required: true
        type: string
      app_version:
        required: true
        type: string
      config_matrix:
        required: true
        type: string
      docker_image_tag:
        required: true
        type: string
      full_config_build:
        default: false
        required: false
        type: boolean
      internal_build:
        required: false
        type: boolean
      upload_artifacts:
        required: true
        type: boolean
      upload_test_artifacts:
        required: true
        type: boolean
      mrbind:
        default: true
        required: false
        type: boolean
      mrbind_c:
        default: true
        required: false
        type: boolean

jobs:
  ubuntu-build-test:
    # the entries carry every compiler field, so spell out the ones that identify a leg;
    # the name must contain the job id for fetch_job_id.py
    name: ubuntu-build-test (${{ inputs.arch }}, ${{ matrix.os }}, ${{ matrix.config }}, ${{ matrix.cxx-compiler }})
    timeout-minutes: 60
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container:
      image: meshlib/meshlib-${{ matrix.os }}${{ inputs.arch == 'arm64' && '-arm64' || '' }}:${{ inputs.docker_image_tag }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON( inputs.config_matrix ) }}
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read  # This is required for actions/checkout
      actions: read   # This is required for wait-for-job
    env:
      # the suffix of the image, deb, artifact and test path names (not usable in `container`)
      ARCH_SUFFIX: ${{ inputs.arch == 'arm64' && '-arm64' || '' }}
      # the leg that uploads PythonStubs and CsharpBindings
      UPLOAD_BINDINGS_SOURCES: ${{ inputs.arch == 'arm64' && matrix.os == 'ubuntu22' && matrix.config == 'Release' && matrix.compiler == 'Clang' }}

    steps:
      - name: Display job info
        run: echo "Building on ${{ matrix.os }} ${{ inputs.arch }} with ${{ matrix.compiler }} in ${{ matrix.config }} mode"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Add our Clang to PATH
        run: echo "PATH=${LLVM_PREFIX}/bin:${PATH}" >> $GITHUB_ENV

      - name: Get AWS instance type
        uses: ./.github/actions/get-aws-instance-type

      - name: Collect runner's system stats
        if: ${{ inputs.internal_build }}
        id: collect-runner-stats
        continue-on-error: true
        uses: ./.github/actions/collect-runner-stats
        with:
          target_os: ${{ matrix.os }}
          target_arch: ${{ inputs.arch }}
          cxx_compiler: ${{ matrix.cxx-compiler }}
          build_config: ${{ matrix.config }}
          aws_instance_type: ${{ env.AWS_INSTANCE_TYPE }}

      - name: Checkout third-party submodules
        run: |
          # have to checkout selective submodules by our own
          # related issue: https://github.com/actions/checkout/issues/1779
          export HOME=${RUNNER_TEMP}
          git config --global --add safe.directory '*'
          # No retry.sh, linux scripts retry themselves.
          scripts/clone_submodules_linux.sh --skip-prebuilt-thirdparty

      - name: Install thirdparty libs
        run: |
          ln -s /usr/local/lib/meshlib-thirdparty-lib/lib ./lib
          ln -s /usr/local/lib/meshlib-thirdparty-lib/include ./include
          ln -s /usr/local/lib/meshlib-thirdparty-lib/share ./share

      - name: Install MRBind
        if: ${{ inputs.mrbind || inputs.mrbind_c }}
        uses: ./.github/actions/build-mrbind
        with:
          # The Dockerfile hash in extra-cache-key busts the cache whenever the
          # toolchain inside the image changes (e.g. glibc, clang upgrade).
          cache-key-prefix: ubuntu-${{ inputs.arch }}-${{ matrix.os }}
          build-script: scripts/mrbind/install_mrbind_ubuntu.sh
          extra-cache-key: ${{ hashFiles('scripts/mrbind/clang_version.txt', format('docker/{0}Dockerfile', matrix.os)) }}

      - name: Create virtualenv
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python3 -m ensurepip --upgrade
          python3 -m pip install --upgrade pip
          echo PATH=$PATH >> $GITHUB_ENV

      - name: Setup python requirements
        run: python3 -m pip install -r ./requirements/python/requirements.txt

      - name: Build
        run: ./scripts/build_source.sh
        env:
          MESHLIB_BUILD_RELEASE: ${{ fromJSON('["OFF", "ON"]')[matrix.config == 'Release'] }}
          MESHLIB_BUILD_DEBUG: ${{ fromJSON('["OFF", "ON"]')[matrix.config == 'Debug'] }}
          CMAKE_C_COMPILER: ${{ matrix.c-compiler }}
          CMAKE_CXX_COMPILER: ${{ matrix.cxx-compiler }}
          MR_VERSION: ${{ inputs.app_version }}
          # options to be passed to cmake
          MR_CMAKE_OPTIONS: >
            -DMR_CXX_STANDARD=${{ matrix.cxx-standard }}
            -DMESHLIB_BUILD_MRCUDA=${{ matrix.build_mrcuda }}
            -DMR_PCH_USE_EXTRA_HEADERS=ON
            -DMESHLIB_BUILD_MRMESH_PY_LEGACY=${{ fromJSON('["ON", "OFF"]')[inputs.mrbind] }}
            -DMESHLIB_BUILD_GENERATED_C_BINDINGS=OFF
            -DMRVIEWER_NO_XDG_DESKTOP_PORTAL=ON

      - name: Wait for C bindings
        if: ${{ inputs.mrbind_c }}
        uses: ./.github/actions/wait-for-job
        with:
          job-name: generate-c-bindings

      - name: Download C bindings
        if: ${{ inputs.mrbind_c }}
        uses: actions/download-artifact@v8
        with:
          name: CBindings
          path: MeshLib/CbindingsTmp

      - name: Prepare C bindings folders
        if: ${{ inputs.mrbind_c }}
        shell: bash
        env:
          BUILD_MRCUDA: ${{ matrix.build_mrcuda }}
        run: |
          rm -rf source/MeshLibC2
          mv MeshLib/CbindingsTmp/MeshLibC2 source
          if [[ "${BUILD_MRCUDA}" == ON ]]; then
            rm -rf source/MeshLibC2Cuda
            mv MeshLib/CbindingsTmp/MeshLibC2Cuda source
          else
            cp -r scripts/mrbind/cuda_placeholder_generated_c/{include,src} source/MeshLibC2Cuda
          fi

      - name: Build C bindings
        if: ${{ inputs.mrbind_c }}
        env:
          MR_VERSION: ${{ inputs.app_version }}
        run: |
          cmake -S . -B build/${{ matrix.config }} -DMESHLIB_BUILD_GENERATED_C_BINDINGS=ON
          cmake --build build/${{ matrix.config }} -j $(nproc) --target MeshLibC2 MeshLibC2Cuda MRTestC2

      - name: PCH size (diagnostic)
        run: find ./build/${{ matrix.config }} -name 'cmake_pch.hxx.gch' -exec ls -lh {} +

      - name: Generate C# bindings # generate only sources
        if: ${{ env.UPLOAD_BINDINGS_SOURCES == 'true' }}
        run: make -f scripts/mrbind/generate.mk TARGET=csharp -B --trace generate

      - name: Upload C# bindings headers
        if: ${{ env.UPLOAD_BINDINGS_SOURCES == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: CsharpBindings
          path: ./source/MRDotNet2/src
          retention-days: 1

      - name: MRMesh Exported Symbols
        run: objdump -T ./build/${{ matrix.config }}/bin/libMRMesh.so | c++filt

      - name: Generate and build Python bindings
        if: ${{ inputs.mrbind }}
        env:
          CXX: ${{ matrix.cxx-compiler }}
          ENABLE_CUDA: ${{ fromJSON('{"ON":1, "OFF":0}') [matrix.build_mrcuda] }}
          # `-fpch-codegen` hits clang defect llvm/llvm-project#203691 on libstdc++-12 (a `<filesystem>`
          # internal homed into the PCH object but never emitted, surfaces at import time). Disable on ubuntu22.
          PCH_CODEGEN: ${{ matrix.os == 'ubuntu22' && '0' || '1' }}
        shell: bash
        run: |
          # The bindings always compile with clang++, which takes the newest GCC in the image - 16 on
          # ubuntu26 - while the deb is built with GCC 15. Pin clang to that same 15.
          CLANG_GCC_PIN=
          if [[ "${{ matrix.os }}" == ubuntu26 ]]; then
            CLANG_GCC_PIN="--gcc-install-dir=/usr/lib/gcc/$(gcc-15 -dumpmachine)/15"
          fi
          make -f scripts/mrbind/generate.mk MODE=none -B --trace MESHLIB_SHLIB_DIR=build/${{matrix.config}}/bin ENABLE_CUDA=${ENABLE_CUDA} PCH_CODEGEN=${PCH_CODEGEN} EXTRA_CFLAGS="${CLANG_GCC_PIN}" EXTRA_LDFLAGS="${CLANG_GCC_PIN}"

      - name: Create Python Stubs
        if: ${{ inputs.mrbind && env.UPLOAD_BINDINGS_SOURCES == 'true' }}
        run: python3 ./scripts/wheel/create_stubs.py

      - name: Upload Python Stubs
        if: ${{ inputs.mrbind && env.UPLOAD_BINDINGS_SOURCES == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: PythonStubs
          path: ./scripts/wheel/meshlib/meshlib/*.pyi
          retention-days: 1

      - name: Run Start-and-Exit Tests
        timeout-minutes: 3
        run: xvfb-run -a ./build/${{ matrix.config }}/bin/MeshViewer -hidden -noEventLoop -unloadPluginsAtEnd

      - name: Verify meshlib.mrmeshpy import
        if: ${{ inputs.mrbind }}
        timeout-minutes: 3
        uses: ./.github/actions/verify-meshlib-python-import
        with:
          build-bin-dir: ./build/${{ matrix.config }}/bin

      - name: Unit Tests
        env:
          GTEST_OUTPUT: 'xml:unit_tests_report_gtest.xml'
        timeout-minutes: 10
        run: ./build/${{ matrix.config }}/bin/MRTest --with-python-tests

      - name: C Unit Tests
        if: ${{ inputs.mrbind_c }}
        timeout-minutes: 10
        run: ./build/${{ matrix.config }}/bin/MRTestC2

      - name: Python Sanity Tests
        if: ${{ inputs.mrbind }}
        timeout-minutes: 8
        working-directory: ./build/${{ matrix.config }}/bin
        run: xvfb-run -a python3 -u ./../../../scripts/run_python_test_script.py -d '../test_python' -a ' --junit-xml=../unit_tests_report_pytest.xml'

      - name: Python Regression Tests
        if: ${{ inputs.internal_build && inputs.mrbind }}
        env:
          RUN_CUDA_ARG: "--run-cuda=negative --junit-xml=../unit_tests_report_regression.xml"
        uses: ./.github/actions/python-regression-tests
        with:
          build_config: ${{ matrix.config }}
          pytest_args: ${{ env.RUN_CUDA_ARG }}
          smoke: ${{ !inputs.full_config_build && matrix.config == 'Debug' }}
          test_artifacts_path: ${{ matrix.os }}${{ env.ARCH_SUFFIX }}/${{ matrix.config }}/${{ matrix.compiler }}
          upload_test_artifacts: ${{ inputs.upload_test_artifacts }}

      - name: Generate Test Performance Report
        continue-on-error: true
        run: |
          scripts/junit_to_csv.py unit_tests_report.csv unit_tests_report_*.xml
          cat unit_tests_report.csv

      - name: Create Deb
        if: ${{ matrix.build_distribution == 'ON' }}
        env:
          MESHLIB_BUILD_RELEASE: "ON"
          MESHLIB_BUILD_DEBUG: "OFF"
        run: |
          ./scripts/distribution.sh ${{inputs.app_version}}
          mv ./distr/meshlib-dev.deb meshlib_${{ matrix.os }}${{ env.ARCH_SUFFIX }}-dev.deb

      - name: Extract Deb
        if: ${{ matrix.build_distribution == 'ON' }}
        run: dpkg --extract meshlib_${{ matrix.os }}${{ env.ARCH_SUFFIX }}-dev.deb $(pwd)/meshlib_install/

      - name: Check Deb Symlinks
        if: ${{ matrix.build_distribution == 'ON' }}
        run: ./scripts/devops/check_deb_libs.sh meshlib_${{ matrix.os }}${{ env.ARCH_SUFFIX }}-dev.deb /usr/local/lib/MeshLib/lib

      - name: Build C++ examples and samples
        if: ${{ matrix.build_distribution == 'ON' }}
        run: |
          cmake \
            -S examples/cpp-examples \
            -B cpp-examples-build \
            -D CMAKE_FIND_ROOT_PATH=$(pwd)/meshlib_install/ \
            -D CMAKE_CXX_COMPILER=${{ matrix.cxx-compiler }}
          cmake \
            --build cpp-examples-build \
            --parallel $(nproc)
          cmake \
            -S examples/cpp-samples \
            -B cpp-samples-build \
            -D CMAKE_FIND_ROOT_PATH=$(pwd)/meshlib_install/ \
            -D CMAKE_CXX_COMPILER=${{ matrix.cxx-compiler }}
          cmake \
            --build cpp-samples-build \
            --parallel $(nproc)

      - name: Build C examples
        if: ${{ matrix.build_distribution == 'ON' }}
        run: |
          cmake \
            -S examples/c-examples \
            -B c-examples-build \
            -D CMAKE_FIND_ROOT_PATH=$(pwd)/meshlib_install/ \
            -D CMAKE_C_COMPILER=${{ matrix.c-compiler }}
          cmake \
            --build c-examples-build \
            --parallel $(nproc)

      - name: Upload Ubuntu Developer Distribution
        if: ${{ inputs.upload_artifacts && matrix.upload_release == 'ON' }}
        uses: actions/upload-artifact@v7
        with:
          name: Distributives_${{ matrix.os }}${{ env.ARCH_SUFFIX }}
          path: meshlib_${{ matrix.os }}${{ env.ARCH_SUFFIX }}-dev.deb
          retention-days: 1

      - name: Collect artifact stats
        # Mirror `Upload Ubuntu Developer Distribution`'s gate -- otherwise
        # matrix entries that don't upload a .deb invoke this step with no
        # matching file and the action fails (with `continue-on-error: true`
        # the job still succeeds, but a confusing `failure`-level annotation
        # is surfaced on the run summary).
        if: ${{ inputs.internal_build && inputs.upload_artifacts && matrix.upload_release == 'ON' }}
        continue-on-error: true
        uses: ./.github/actions/collect-artifact-stats
        with:
          artifact_path: ${{ github.workspace }}
          artifact_glob: meshlib_${{ matrix.os }}${{ env.ARCH_SUFFIX }}-dev.deb
          stats_file_suffix: -${{ steps.collect-runner-stats.outputs.job_id }}
