name: Publish Wasm module

on:
  release:
    types: [ released ]
  workflow_dispatch:
    inputs:
      release_tag:
        required: true
        type: string
      draft:
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      draft:
        required: false
        type: boolean
        default: true

env:
  TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
  IS_DRAFT: ${{ inputs.draft || false }}

jobs:
  # Only the highest release may move the unversioned CDN path and the npm
  # `latest` tag. Publishing an older line is not supposed to happen, but it
  # would silently point both at older code.
  newest:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      is_newest: ${{ steps.check.outputs.is_newest }}
    steps:
      - name: Compare against the highest published release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          highest=$(
            gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
              | jq -r '.[] | select( ( .draft or .prerelease ) | not ) | .tag_name' \
              | grep -E '^v[0-9]+(\.[0-9]+)+$' | sort -V | tail -n1
          )
          [ "${highest}" = "${TAG}" ] && is_newest=true || is_newest=false
          echo "highest published: ${highest}; publishing: ${TAG}; is_newest=${is_newest}"
          echo "is_newest=${is_newest}" >> $GITHUB_OUTPUT

  cdn:
    needs: newest
    permissions:
      id-token: write   # OIDC -> AWS
      contents: write   # download the draft release asset
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::662635244517:role/GitHubMeshLibCdn
          aws-region: us-east-1

      - name: Download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${TAG}" --pattern "js-meshlib-*.tgz" --repo ${{ github.repository }} --clobber

      - name: Upload to S3
        env:
          BUCKET: s3://cdn-meshlib-js
          IS_NEWEST: ${{ needs.newest.outputs.is_newest }}
        run: |
          for TGZ in js-meshlib-*.tgz ; do tar -xzf "${TGZ}" --strip-components=1 ; done
          upload() {
            local dest="$1" ; shift
            gzip -9 -c "${f}.mjs"  | aws s3 cp - "${dest}/${f}.mjs"  --content-type text/javascript   --content-encoding gzip "$@"
            gzip -9 -c "${f}.wasm" | aws s3 cp - "${dest}/${f}.wasm" --content-type application/wasm  --content-encoding gzip "$@"
          }
          for f in meshlib meshlib-mt ; do
            if [ "${IS_DRAFT}" = "true" ] ; then
              upload "${BUCKET}/${f}-draft"  --cache-control "public, max-age=300"
            else
              upload "${BUCKET}/${f}@${TAG}" --cache-control "public, max-age=31536000, immutable"
              if [ "${IS_NEWEST}" = "true" ] ; then
                upload "${BUCKET}/${f}"      --cache-control "public, max-age=300"
              fi
            fi
          done

      - name: Invalidate draft
        if: ${{ env.IS_DRAFT == 'true' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CDN_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/meshlib-draft/*" "/meshlib-mt-draft/*"

      - name: Invalidate latest
        if: ${{ env.IS_DRAFT != 'true' && needs.newest.outputs.is_newest == 'true' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CDN_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/meshlib/*" "/meshlib-mt/*"

  npm:
    needs: newest
    permissions:
      id-token: write   # OIDC -> npm trusted publishing
      contents: write   # download the draft release asset
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24   # staged publishing needs npm >= 11.15
          registry-url: https://registry.npmjs.org

      - name: Download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${TAG}" --pattern "js-meshlib-*.tgz" --repo ${{ github.repository }} --clobber

      - name: Publish npm packages
        env:
          IS_NEWEST: ${{ needs.newest.outputs.is_newest }}
        run: |
          if [ "${IS_DRAFT}" = "true" ] ; then
            ARGS="--dry-run"
          else
            ARGS="--provenance"
          fi
          # An older line still gets published, just not as what `npm install`
          # resolves to. `release-<series>` cannot be read as a semver range,
          # which npm rejects as a dist-tag.
          if [ "${IS_NEWEST}" = "true" ] ; then
            DIST_TAG=latest
          else
            series="${TAG#v}"
            DIST_TAG="release-${series%%.*}.$(echo "${series}" | cut -d. -f2)"
          fi
          for TGZ in js-meshlib-*.tgz ; do
            npm stage publish "./${TGZ}" --access public --tag "${DIST_TAG}" ${ARGS}
          done
