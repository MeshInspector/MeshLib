name: Test Nuget package with .NET consumers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to test'
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  nuget-consumer-test:
    name: NuGet consumer test (${{ matrix.rid }}, ${{ matrix.frameworks }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # One job per runtimes/<rid>/native folder of the package; net47 runs on Windows only
        include:
          - rid: win-x64
            arch: x64
            runner: windows-2025
            frameworks: net47 net10.0
          - rid: win-arm64
            arch: ARM64
            runner: windows-11-vs2026-arm
            frameworks: net47 net10.0
          - rid: linux-x64
            arch: x64
            runner: ubuntu-24.04
            frameworks: net10.0
          - rid: linux-arm64
            arch: ARM64
            runner: ubuntu-24.04-arm
            frameworks: net10.0
          - rid: osx-x64
            arch: x64
            runner: macos-12-intel
            frameworks: net10.0
          - rid: osx-arm64
            arch: ARM64
            runner: macos-13
            frameworks: net10.0
    timeout-minutes: 30
    env:
      PROJECT_DIR: test_nuget/NugetTestProj
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Download nuget package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ${{ inputs.release_tag }} --pattern "*.nupkg" --repo ${{ github.repository }} --clobber

      - name: Put package into local NuGet feed
        id: feed
        shell: pwsh
        run: |
          $pkg = Get-ChildItem -Filter "MeshLib*.nupkg" | Select-Object -First 1
          if (!$pkg) {
            Write-Error "No MeshLib*.nupkg file found"
            exit 1
          }
          if ($pkg.Name -notmatch '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+') {
            Write-Error "Cannot extract version from $($pkg.Name)"
            exit 1
          }
          $pkgVersion = $Matches[0]
          $feedDir = Join-Path $env:GITHUB_WORKSPACE "$env:PROJECT_DIR/nuget_repo"
          New-Item -ItemType Directory -Force -Path $feedDir | Out-Null
          Move-Item $pkg.FullName (Join-Path $feedDir "MeshLib.$pkgVersion.nupkg")
          "package_version=$pkgVersion" >> $env:GITHUB_OUTPUT

      - name: Build consumers
        shell: pwsh
        run: |
          foreach ($tfm in -split '${{ matrix.frameworks }}') {
            dotnet build $env:PROJECT_DIR -c Release -f $tfm -p:MeshLibVersion=${{ steps.feed.outputs.package_version }} -p:PlatformTarget=${{ matrix.arch }}
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run consumers
        shell: pwsh
        run: |
          $exitCode = 0
          foreach ($tfm in -split '${{ matrix.frameworks }}') {
            $out = "$env:PROJECT_DIR/bin/Release/$tfm"
            if ($tfm -eq 'net47') {
              & "$out/NugetTestProj.exe"
            } else {
              dotnet "$out/NugetTestProj.dll"
            }
            if ($LASTEXITCODE -ne 0) { $exitCode = $LASTEXITCODE }
          }
          exit $exitCode
