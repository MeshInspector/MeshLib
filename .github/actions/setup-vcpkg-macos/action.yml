name: 'Set up vcpkg for MeshLib (macOS)'
description: 'Checks out vcpkg under /usr/local/share/vcpkg and builds ./vcpkg_installed with Xcode clang, restoring and saving it in the GitHub cache. The caller sets DEVELOPER_DIR to pick the Xcode version.'

inputs:
  vcpkg-version:
    description: 'Vcpkg git tag to check out under /usr/local/share/vcpkg.'
    required: true
  vcpkg-triplet:
    description: 'Vcpkg triplet name, e.g. arm64-osx-meshlib.'
    required: true
  xcode-version:
    description: 'Xcode version selected by the caller via DEVELOPER_DIR. Used in the cache key.'
    required: true
  internal-build:
    description: 'String boolean ("true" or "false"). When "true", configure AWS credentials via OIDC so vcpkg can write the S3 binary cache. The caller must grant `permissions.id-token: write` on the job.'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up vcpkg
      shell: bash
      working-directory: /usr/local/share/vcpkg
      run: |
        git fetch --depth 1 origin tag "${{ inputs.vcpkg-version }}"
        git checkout --force "${{ inputs.vcpkg-version }}"
        ./bootstrap-vcpkg.sh -disableMetrics

    - name: Configure AWS Credentials
      if: ${{ inputs.internal-build == 'true' }}
      uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
      with:
        role-to-assume: arn:aws:iam::259351611210:role/GitHubMeshLibAwsCredsRole
        aws-region: us-east-1
        role-duration-seconds: 7200
        retry-max-attempts: 5

    - name: Compute vcpkg cache key
      shell: bash
      env:
        VCPKG_TRIPLET: ${{ inputs.vcpkg-triplet }}
      run: |
        # /usr/bin/clang++ is the xcode-select shim; hash the toolchain binary it dispatches to
        FILES_HASH=$(scripts/devops/cache_key.sh \
          thirdparty/vcpkg/vcpkg.json \
          thirdparty/vcpkg/ports \
          thirdparty/vcpkg/triplets/${VCPKG_TRIPLET}.cmake \
          scripts/build_vcpkg_thirdparty.sh \
          "$(xcrun --find clang++)")
        KEY_PREFIX="vcpkg-installed-${{ inputs.vcpkg-version }}-${VCPKG_TRIPLET}-xcode${{ inputs.xcode-version }}"
        echo "VCPKG_CACHE_KEY_PREFIX=${KEY_PREFIX}" >> $GITHUB_ENV
        echo "VCPKG_CACHE_KEY=${KEY_PREFIX}-${FILES_HASH}" >> $GITHUB_ENV

    - name: Restore vcpkg installed tree
      id: vcpkg-cache
      uses: actions/cache/restore@v5
      with:
        path: vcpkg_installed
        key: ${{ env.VCPKG_CACHE_KEY }}
        # fall back to the latest tree with the same prefix
        restore-keys: ${{ env.VCPKG_CACHE_KEY_PREFIX }}-

    - name: Build thirdparty libs
      shell: bash
      env:
        VCPKG_TRIPLET: ${{ inputs.vcpkg-triplet }}
        VCPKG_VERSION: ${{ inputs.vcpkg-version }}
      run: |
        source thirdparty/vcpkg/configure_s3_cache.sh
        # resolve the compiler paths for proper vcpkg cache key computation
        export CC=$(xcrun --find clang)
        export CXX=$(xcrun --find clang++)
        export SDKROOT=$(xcrun --show-sdk-path)
        scripts/build_vcpkg_thirdparty.sh

    - name: Save vcpkg installed tree
      if: ${{ steps.vcpkg-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: vcpkg_installed
        key: ${{ env.VCPKG_CACHE_KEY }}
