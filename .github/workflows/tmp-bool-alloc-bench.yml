name: tmp Boolean allocator A/B

on:
  push:
    branches: [ tmp-bool-alloc-bench ]

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: [ self-hosted, macos-12-intel ], name: MACPRO2013, artifact: Macos-x64 }
          - { runner: [ self-hosted, macos-13 ], name: MacBook-Pro-Daniil, artifact: Macos-arm64 }
          - { runner: [ self-hosted, our-macos-15 ], name: MACBOOK-PRO-16-2021-TBI-2, artifact: Macos-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    env:
      RUNNER_LABEL: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/bench

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e

      - name: Download master wheel
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: whl/master
          run-id: 40527563689
          github-token: ${{ github.token }}

      - name: Download std::allocator wheel
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: whl/std
          run-id: 40527569919
          github-token: ${{ github.token }}

      - name: Install wheels into two venvs
        run: |
          echo "runner: $RUNNER_NAME, $(sysctl -n machdep.cpu.brand_string), macOS $(sw_vers -productVersion)"
          ls -R whl
          for v in master std; do
            rm -rf venv_$v
            uv venv --python 3.12 venv_$v
            uv pip install --python venv_$v/bin/python numpy
            uv pip install --python venv_$v/bin/python --no-deps --no-index whl/$v/*.whl
          done

      - name: Benchmark
        run: venv_master/bin/python .github/bench/ab.py 10 master="$PWD/venv_master/bin/python" std="$PWD/venv_std/bin/python"
