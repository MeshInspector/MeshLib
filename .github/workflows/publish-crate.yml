name: Publish Rust crate

# Publishes `meshlib_<version>_rust_bindings.zip` of the release to crates.io. Its `build.rs` downloads the libraries
# from the same release, so the release must be published first (`cargo publish` builds the crate to verify it).
# Authentication is crates.io Trusted Publishing: the crate's settings on crates.io must list this repository and workflow.

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version_tag:
        description: Tag of the release to publish the crate of
        required: true
        type: string

jobs:
  publish:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Trusted Publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Download the crate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version_tag || github.event.release.tag_name }}
        run: |
          VERSION="${TAG%%-*}"
          scripts/retry.sh -- gh release download "$TAG" --repo ${{ github.repository }} --pattern "meshlib_${VERSION}_rust_bindings.zip"
          # Outside the checkout, or `cargo publish` takes the crate for uncommitted files of this repository.
          unzip -q "meshlib_${VERSION}_rust_bindings.zip" -d "$RUNNER_TEMP"
          grep '^version' "$RUNNER_TEMP/MeshLibRust/Cargo.toml"

      # Re-running for an already published version must not fail: crates.io never accepts the same version twice.
      - name: Check if already published
        id: check
        working-directory: ${{ runner.temp }}/MeshLibRust
        run: |
          CRATE_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)"
          STATUS="$(curl -s -o /dev/null -w '%{http_code}' -A "MeshLib CI (github.com/${{ github.repository }})" "https://crates.io/api/v1/crates/meshlib/$CRATE_VERSION")"
          echo "crates.io status for meshlib $CRATE_VERSION: $STATUS"
          echo "published=$([ "$STATUS" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Authenticate to crates.io
        if: ${{ steps.check.outputs.published == 'false' }}
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        if: ${{ steps.check.outputs.published == 'false' }}
        working-directory: ${{ runner.temp }}/MeshLibRust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish
