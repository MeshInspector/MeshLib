name: Test Nuget package with .NET consumers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to test'
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

# pr-test releases are drafts; reading them requires a write token.
permissions:
  contents: write

jobs:
  nuget-consumer-test:
    name: NuGet consumer test (net47, net10.0)
    # net47 needs .NET Framework, and the package's natives are win-x64 only.
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PROJECT_DIR: test_nuget/NugetTestProj
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Keep the write token out of .git/config.
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Newest TFM under test; the same SDK builds the net47 target.
          dotnet-version: '10.x'

      - name: Download nuget package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ${{ inputs.release_tag }} --pattern "*.nupkg" --repo ${{ github.repository }} --clobber

      - name: Put package into local NuGet feed
        id: feed
        shell: pwsh
        run: |
          $pkg = Get-ChildItem -Filter "MeshLib*.nupkg" | Select-Object -First 1
          if (!$pkg) {
            Write-Error "No MeshLib*.nupkg file found"
            exit 1
          }
          if ($pkg.Name -notmatch '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+') {
            Write-Error "Cannot extract version from $($pkg.Name)"
            exit 1
          }
          $pkgVersion = $Matches[0]
          $feedDir = Join-Path $env:GITHUB_WORKSPACE "$env:PROJECT_DIR/nuget_repo"
          New-Item -ItemType Directory -Force -Path $feedDir | Out-Null
          Move-Item $pkg.FullName (Join-Path $feedDir "MeshLib.$pkgVersion.nupkg")
          Write-Output "Testing MeshLib $pkgVersion"
          "package_version=$pkgVersion" >> $env:GITHUB_OUTPUT

      - name: Build consumers
        shell: pwsh
        run: |
          dotnet build $env:PROJECT_DIR -c Release -p:MeshLibVersion=${{ steps.feed.outputs.package_version }}
          exit $LASTEXITCODE

      - name: Run consumers
        shell: pwsh
        run: |
          $failed = @()
          foreach ($tfm in 'net47', 'net10.0') {
            $dir = Join-Path $env:GITHUB_WORKSPACE "$env:PROJECT_DIR/bin/Release/$tfm"
            $exe = Join-Path $dir "NugetTestProj.exe"
            Write-Output "--- $tfm ---"
            if (-not (Test-Path $exe)) {
              Write-Output "::error title=NuGet consumer test failed::$tfm produced no executable at $exe"
              $failed += $tfm
              continue
            }
            # The natives have to reach the output dir for the run to work at all:
            # flat next to the exe for net47, under runtimes/ for net10.0.
            $flatDlls = (Get-ChildItem -Path $dir -Filter *.dll -File).Count
            $sizeMb = [math]::Round((Get-ChildItem -Path $dir -Recurse -File | Measure-Object -Property Length -Sum).Sum / 1MB)
            Write-Output "output: $flatDlls dll(s) next to the exe, $sizeMb MB total"
            $out = (& $exe 2>&1) -join "`n"
            $code = $LASTEXITCODE
            Write-Output $out
            if ($code -ne 0) {
              Write-Output "::error title=NuGet consumer test failed::$tfm exited with $code"
              $failed += $tfm
              continue
            }
            if ($out -notmatch '8 points, 12 faces') {
              Write-Output "::error title=NuGet consumer test failed::$tfm printed unexpected counts"
              $failed += $tfm
            }
          }
          if ($failed.Count -gt 0) {
            Write-Error "Failing target frameworks: $($failed -join ', ')"
            exit 1
          }
          Write-Output "All target frameworks passed"
